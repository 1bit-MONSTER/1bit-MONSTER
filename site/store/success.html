<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — 1bit.monster</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root{--bg:#0B0B0B;--green:#C6FF3D;--pink:#C6FF3D;--blue:#C6FF3D;--text:#EDEFEA;--muted:#A0A599;--dim:#6B706A;--border:#232323;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Serif Text',ui-serif,Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;}
  .card{background:#141414;border:1px solid var(--border);border-radius:20px;padding:48px 40px;max-width:520px;margin:20px;}
  h1{font-size:28px;font-weight:900;margin:16px 0;}
  .g{color:var(--green);}.p{color:var(--pink);}.b{color:var(--blue);}
  p{color:var(--muted);line-height:1.6;margin:12px 0;}
  .mono{font-family:'DM Mono',monospace;}
  .btn{display:inline-block;margin-top:20px;padding:14px 28px;border-radius:999px;font-weight:700;background:var(--green);color:var(--bg);text-decoration:none;transition:box-shadow .2s;}
  .btn:hover{box-shadow:0 6px 24px rgba(0,255,0,.30);}
</style>
