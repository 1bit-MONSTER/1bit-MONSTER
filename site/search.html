  <style>
    :root {
      --bg: oklch(99% 0.002 240); --surface: oklch(100% 0 0);
      --fg: oklch(18% 0.012 250); --muted: oklch(54% 0.012 250);
      --border: oklch(92% 0.005 250); --accent: oklch(58% 0.18 255);
      --accent-soft: color-mix(in oklch, var(--accent) 10%, transparent);
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--fg); font-family: var(--font); line-height: 1.5; padding: 48px 20px; }
    .wrap { max-width: 760px; margin: 0 auto; }
    header { margin-bottom: 28px; }
    header a { color: var(--accent); text-decoration: none; font-weight: 600; }
    h1 { font-size: 34px; margin: 6px 0 4px; }
    .sub { color: var(--muted); font-size: 15px; }
    input[type="search"] {
      width: 100%; font-size: 18px; padding: 14px 16px; border: 1px solid var(--border);
      border-radius: 10px; background: var(--surface); color: var(--fg);
      font-family: var(--font);
    }
    input[type="search"]:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    .meta { color: var(--muted); font-size: 13px; margin: 10px 2px; }
    .result { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin: 10px 0; }
    .result h3 { font-size: 16px; margin-bottom: 4px; }
    .result h3 a { color: var(--fg); text-decoration: none; }
    .result h3 a:hover { color: var(--accent); }
    .result p { color: var(--muted); font-size: 14px; }
    .result .url { font-family: var(--font-mono); font-size: 11px; color: var(--accent); }
    .badge { display: inline-block; font-size: 11px; background: var(--accent-soft); color: var(--accent); border-radius: 20px; padding: 2px 9px; margin-left: 8px; vertical-align: 2px; }
    .related h2 { font-size: 15px; color: var(--muted); margin: 26px 0 8px; }
    .related a { display: inline-block; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 6px 13px; margin: 4px 6px 0 0; color: var(--fg); text-decoration: none; font-size: 13px; }
    .related a:hover { border-color: var(--accent); color: var(--accent); }
    .empty { color: var(--muted); padding: 30px 0; text-align: center; }
    .hint { color: var(--muted); font-size: 13px; margin-top: 14px; }
    mark { background: color-mix(in oklch, var(--accent) 22%, transparent); border-radius: 3px; padding: 0 2px; }
      /* ─── 1bit theme modes ────────────────────────────────────────────────
       light mode (default) | auto (follows OS) | dark mode.
       Appended by scripts/site_theme_modes.py — rerun to regenerate. */
    :root {
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
    }
    :root[data-theme="dark"] {
        color-scheme: dark;
        --bg:      oklch(16.5% 0.014 250);
        --surface: oklch(21% 0.016 250);
        --fg:      oklch(94% 0.01 250);
        --muted:   oklch(68% 0.02 250);
        --border:  oklch(29% 0.018 250);
        --accent:  oklch(74% 0.15 258);
        --status:  oklch(79% 0.13 156);
        /* pinned: these carry the "ink console / paper" identity in both modes */
        --ink-deep:      oklch(26% 0.011 250);
        --on-dark:       oklch(97% 0.004 250);
        --on-dark-muted: color-mix(in oklch, white 68%, transparent);
        --border-dark:   color-mix(in oklch, white 18%, transparent);
    }
    :root[data-theme="dark"] .btn-primary {
        background: color-mix(in oklch, var(--accent) 62%, black);
        color: oklch(98% 0.002 250);
    }
    :root[data-theme="dark"] .btn-primary:hover {
        background: color-mix(in oklch, var(--accent) 74%, black);
    }
    :root[data-theme="dark"] .section-dark .btn-primary {
        background: var(--accent-bright);
        color: var(--ink-deep);
    }
    :root[data-theme="dark"] .section-dark .btn-primary:hover {
        background: color-mix(in oklch, var(--accent) 88%, white);
    }
    :root[data-theme="dark"] .codeblock {
        background: oklch(23% 0.015 250);
        color: oklch(95% 0.005 250);
    }
    :root[data-theme="dark"] .codeblock .c {
        color: color-mix(in oklch, oklch(95% 0.005 250) 55%, transparent);
    }
    :root[data-theme="dark"] .product-tile {
        background: linear-gradient(180deg, oklch(99.4% 0.002 240), oklch(96% 0.004 250));
    }
    :root[data-theme="dark"] .sticker-tile {
        background-color: oklch(96.8% 0.004 250);
        background-image: radial-gradient(color-mix(in oklch, oklch(18% 0.012 250) 16%, transparent) 1px, transparent 1px);
        color: oklch(26% 0.011 250);
    }
    :root[data-theme="dark"] .product-tile .sheet {
        fill: oklch(99.4% 0.002 240);
        stroke: oklch(26% 0.011 250);
    }
    :root[data-theme="dark"] .product-tile .ink, .product-tile .p-ink, .product-tile .ink-stroke {
        fill: oklch(26% 0.011 250);
    }
    :root[data-theme="dark"] .product-tile .ink-stroke {
        stroke: oklch(26% 0.011 250);
    }
    :root[data-theme="dark"] .product-tile .ink2 {        fill: oklch(39% 0.009 250);
    }
    :root[data-theme="dark"] .product-tile .sub {        fill: oklch(52% 0.008 250);
    }
    :root[data-theme="dark"] .product-tile .shade {        fill: color-mix(in oklch, oklch(18% 0.012 250) 13%, transparent);
    }
    :root[data-theme="dark"] .product-tile .p-mid {        fill: oklch(45% 0.009 250);
    }
    :root[data-theme="dark"] .product-tile .p-soft {        fill: oklch(75% 0.005 250);
    }
    :root[data-theme="dark"] .product-tile .p-foot {        fill: color-mix(in oklch, oklch(18% 0.012 250) 16%, transparent);
    }
    :root[data-theme="dark"] .product-tile .print, .product-tile .p-print, .product-tile .p-line, .product-tile .relay {
        fill: oklch(99% 0.001 240);
    }
    :root[data-theme="dark"] .product-tile .print-stroke {
        stroke: oklch(99% 0.001 240);
    }

    @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] {
    color-scheme: dark;
    --bg:      oklch(16.5% 0.014 250);
    --surface: oklch(21% 0.016 250);
    --fg:      oklch(94% 0.01 250);
    --muted:   oklch(68% 0.02 250);
    --border:  oklch(29% 0.018 250);
    --accent:  oklch(74% 0.15 258);
    --status:  oklch(79% 0.13 156);
    /* pinned: these carry the "ink console / paper" identity in both modes */
    --ink-deep:      oklch(26% 0.011 250);
    --on-dark:       oklch(97% 0.004 250);
    --on-dark-muted: color-mix(in oklch, white 68%, transparent);
    --border-dark:   color-mix(in oklch, white 18%, transparent);
    }
    :root[data-theme="auto"] .btn-primary {
    background: color-mix(in oklch, var(--accent) 62%, black);
    color: oklch(98% 0.002 250);
    }
    :root[data-theme="auto"] .btn-primary:hover {
    background: color-mix(in oklch, var(--accent) 74%, black);
    }
    :root[data-theme="auto"] .section-dark .btn-primary {
    background: var(--accent-bright);
    color: var(--ink-deep);
    }
    :root[data-theme="auto"] .section-dark .btn-primary:hover {
    background: color-mix(in oklch, var(--accent) 88%, white);
    }
    :root[data-theme="auto"] .codeblock {
    background: oklch(23% 0.015 250);
    color: oklch(95% 0.005 250);
    }
    :root[data-theme="auto"] .codeblock .c {
    color: color-mix(in oklch, oklch(95% 0.005 250) 55%, transparent);
    }
    :root[data-theme="auto"] .product-tile {
    background: linear-gradient(180deg, oklch(99.4% 0.002 240), oklch(96% 0.004 250));
    }
    :root[data-theme="auto"] .sticker-tile {
    background-color: oklch(96.8% 0.004 250);
    background-image: radial-gradient(color-mix(in oklch, oklch(18% 0.012 250) 16%, transparent) 1px, transparent 1px);
    color: oklch(26% 0.011 250);
    }
    :root[data-theme="auto"] .product-tile .sheet {
    fill: oklch(99.4% 0.002 240);
    stroke: oklch(26% 0.011 250);
    }
    :root[data-theme="auto"] .product-tile .ink, .product-tile .p-ink, .product-tile .ink-stroke {
    fill: oklch(26% 0.011 250);
    }
    :root[data-theme="auto"] .product-tile .ink-stroke {
    stroke: oklch(26% 0.011 250);
    }
    :root[data-theme="auto"] .product-tile .ink2 {    fill: oklch(39% 0.009 250);
    }
    :root[data-theme="auto"] .product-tile .sub {    fill: oklch(52% 0.008 250);
    }
    :root[data-theme="auto"] .product-tile .shade {    fill: color-mix(in oklch, oklch(18% 0.012 250) 13%, transparent);
    }
    :root[data-theme="auto"] .product-tile .p-mid {    fill: oklch(45% 0.009 250);
    }
    :root[data-theme="auto"] .product-tile .p-soft {    fill: oklch(75% 0.005 250);
    }
    :root[data-theme="auto"] .product-tile .p-foot {    fill: color-mix(in oklch, oklch(18% 0.012 250) 16%, transparent);
    }
    :root[data-theme="auto"] .product-tile .print, .product-tile .p-print, .product-tile .p-line, .product-tile .relay {
    fill: oklch(99% 0.001 240);
    }
    :root[data-theme="auto"] .product-tile .print-stroke {
    stroke: oklch(99% 0.001 240);
    }
    }
    /* auto + light: nothing to override — the base tokens are already light. */

    /* ─── theme switch (light / auto / dark) ───────────────────────── */
    .theme-switch {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 3px; border: 1px solid var(--border); border-radius: 999px;
      background: color-mix(in oklch, var(--fg) 4%, transparent);
      flex: 0 0 auto;
    }
    .theme-switch .ts-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 24px; padding: 0; border: 0; border-radius: 999px;
      background: transparent; color: var(--muted); cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .theme-switch .ts-btn:hover { color: var(--fg); }
    .theme-switch .ts-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    html[data-theme="light"] .theme-switch [data-choice="light"],
    html[data-theme="auto"]  .theme-switch [data-choice="auto"],
    html[data-theme="dark"]  .theme-switch [data-choice="dark"] {
      background: var(--surface); color: var(--fg);
      box-shadow: 0 1px 3px color-mix(in oklch, var(--fg) 18%, transparent);
    }
    @media (max-width: 720px) {
      .topnav-inner { flex-wrap: wrap; row-gap: 12px; }
      .topnav nav { order: 3; width: 100%; gap: var(--gap-md); justify-content: space-between; flex-wrap: wrap; }
      .theme-switch { order: 4; }
    }


    /* search page: theme switch rides the header row */
    .wrap > header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
    .wrap > header .theme-switch { margin-left: auto; }

</style>

<body>
  <div class="wrap">
    <header>
      <a href="/">← 1bit.MONSTER</a>

      <span class="theme-switch" role="group" aria-label="Theme: light, auto, or dark">
        <button type="button" class="ts-btn" data-choice="light" title="Light mode" aria-label="Light mode" aria-pressed="false">

        </button>

    </header>

    <input type="search" id="q" placeholder="try “NPU”, “ROCm”, “speculative decoding”, “1-bit format”…" autofocus autocomplete="off" />

<script src="https://context7.com/widget.js" data-library="/1bit-monster/1bit-monster"></script>
  <script>
    const STOP = new Set("the a an and or but of to in on for with at by from as is are was were be been it its this that these those not no if then than so such all any how what when where which who whom your you we they he she their our".split(" "));

    async function load() {
      const [idx, rel] = await Promise.all([
        fetch("search-index.json").then(r => r.json()),
        fetch("related.json").then(r => r.json()).catch(() => null),
      ]);
      if (rel) {
        const list = Object.values(rel.related).flat().sort((a, b) => b.score - a.score);
        const seen = new Set(); const links = [];
        for (const r of list) {
          if (!seen.has(r.url) && !r.url.includes("index.html")) { seen.add(r.url); links.push(r); }
          if (links.length >= 12) break;
        }
        document.getElementById("relatedLinks").innerHTML = links
          .map(r => `<a href="${r.url}">${r.title.replace(/\s*\|\s*1bit\.MONSTER\s*$/, "")}</a>`).join("");
      } else {
        document.getElementById("related").style.display = "none";
      }
      return idx;
    }

    function tokenize(s) {
      return (s.toLowerCase().match(/[a-z0-9]+(?:[-'][a-z0-9]+)*/g) || []).filter(t => t.length > 1 && !STOP.has(t));
    }

    function scoreChunk(chunk, terms) {
      const text = chunk.text.toLowerCase();
      let s = 0, matched = 0;
      for (const t of terms) {
        const n = (text.match(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g")) || []).length;
        if (n > 0) { s += 1 + Math.log2(1 + n); matched++; }
      }
      // slight boost for title hits
      const title = chunk.title.toLowerCase();
      for (const t of terms) if (title.includes(t)) s += 2;
      return { s, matched };
    }

    function esc(s) {
      return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function search(idx, query) {
      const terms = tokenize(query);
      const root = document.getElementById("results");
      const meta = document.getElementById("meta");
      if (!terms.length) { root.innerHTML = ""; meta.textContent = `${idx.chunks.length} chunks indexed — type to search.`; return; }
      const scored = idx.chunks.map(c => ({ ...c, ...scoreChunk(c, terms) }))
        .filter(c => c.matched > 0)
        .sort((a, b) => b.s - a.s)
        .slice(0, 12);
      meta.textContent = `“${esc(query)}” — ${scored.length} hits`;
      if (!scored.length) { root.innerHTML = `<div class="empty">Nothing found — try “NPU”, “GGUF”, “benchmarks”, “ROCm”.</div>`; return; }
      root.innerHTML = scored.map(c => {
        const i = c.text.toLowerCase().indexOf(terms[0]);
        const from = Math.max(0, i - 90);
        const snip = (from > 0 ? "…" : "") + esc(c.text.slice(from, from + 240)) + (from + 240 < c.text.length ? "…" : "");
        const url = c.page === "index.html" ? "/" : `/${c.page}`;
        return `<div class="result">
          <h3><a href="${url}">${esc(c.title.replace(/\s*\|\s*1bit\.MONSTER\s*$/, ""))}</a><span class="badge">${c.matched}/${terms.length} terms</span></h3>
          <p>${snip}</p>
          <span class="url">${url}</span>
        </div>`;
      }).join("");
    }

    let indexPromise = load();
    const q = document.getElementById("q");
    let t;
    q.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(async () => { const idx = await indexPromise; search(idx, q.value.trim()); }, 120);
    });
    window.addEventListener("load", async () => {
      const idx = await indexPromise;
      const qp = new URLSearchParams(location.search).get("q") || "";
      if (qp.trim()) q.value = qp.trim();
      search(idx, q.value.trim());
    });
  </script>
