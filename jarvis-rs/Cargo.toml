[package]
name = "jarvis-rs"
version = "0.1.0"
edition = "2024"
description = "Local private AI agent server (Rust port of jarvis/*.py) — RAG, tool invocation, multi-step planning, local multi-turn memory, permission gate, voice I/O, all on-device against the local NPU/GPU backends"
license = "MIT"

[[bin]]
name = "jarvis-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
hound = "3"
tempfile = "3"
futures-util = "0.3"
hostname = "0.4"
tokio-stream = "0.1"
async-stream = "0.3"


# ── Phase 2: STT ──────────────────────────────────────────────────────────
whisper-rs = { version = "0.14", default-features = false }

# ── Phase 3: TTS ──────────────────────────────────────────────────────────
candle-core = "0.9"
candle-nn = "0.9"
tar = "0.4"
flate2 = "1"
