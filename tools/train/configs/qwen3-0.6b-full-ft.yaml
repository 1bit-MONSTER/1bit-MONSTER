# SPDX-License-Identifier: MIT
# Qwen3-0.6B Full fine-tune — uses Strix Halo's 128 GB unified memory
model: "unsloth/Qwen3-0.6B"
load_in_4bit: false          # Full FT needs more precision

max_seq_length: 16384         # 16K on Strix Halo with 128 GB
per_device_batch_size: 1
gradient_accumulation_steps: 8
max_steps: 2000
learning_rate: 1e-5
warmup_steps: 50
optim: "adamw_8bit"

dataset: "yahma/alpaca-cleaned"
dataset_split: "train"

output_dir: "./outputs"
save_steps: 500
