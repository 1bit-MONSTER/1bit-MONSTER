[pr_agent]
model = "deepseek/deepseek-v4-flash"
model_turbo = "deepseek/deepseek-v4-flash"
fallback_models = []
verbosity_level = 2
publish_output = true
publish_output_progress = false

[pr_agent.pr_reviewer]
require_score_review = true
require_tests_review = true
num_ais = 3
extra_instructions = "Focus on INT8 quantization correctness, NPU context lifecycle bugs, BFP16 precision issues, and C++ memory safety. Reviewer: think like an NPU hardware engineer reviewing inference engine code. SCOPE: this repo is the inference engine PLUS the Jarvis offline assistant layer (personas, skills, themes, workers, integrations, zaya_audio are part of the offline package — engine + Jarvis = offline supreme for local AI + inference). Reject or flag changes that are NOT engine or Jarvis scope: new web apps, dashboards, unrelated services, speculative abstractions, or new top-level directories, unless the PR body explicitly justifies them as product scope.\n"
inline_code_comments = true
automatic_review = true
persistent_comment = false

[pr_agent.pr_description]
publish_labels = true
extra_instructions = "Use conventional commits. Include performance impact (ms/tok delta). Tag NPU-specific changes with [npu]."
enable_help_text = false

[pr_agent.pr_code_suggestions]
num_code_suggestions = 4
extra_instructions = "Prefer suggestions that reduce context-swapping overhead, eliminate heap allocations in decode loop, or improve INT8 quantization accuracy."

[pr_agent.pr_code_suggestions_reflect]
extra_instructions = "Reflect on whether suggested code would actually improve tok/s or token quality on real NPU hardware. Discard suggestions that are purely stylistic."

[pr_agent.pr_update_changelog]
push_changelog_changes = true

[pr_agent.pr_help_message]
enable_help_text = false

[config]
model = "deepseek/deepseek-v4-flash"
fallback_models = []
ignore_pr_labels = []
# 2026-08-18: Kimi K3 replaced by DeepSeek deepseek-v4-flash (litellm
# deepseek provider, api.deepseek.com). Key: DEEPSEEK_API_KEY repo secret
# (set 2026-08-18; the Aug-12-era DeepSeek key had expired, and the Kimi K3
# key also went invalid -> "Incorrect API key" auth errors on every run).
# v4-flash is a reasoning model (reasoning_content), like K3.
custom_model_max_tokens = 128000
# DeepSeek supports temperature (unlike K3's server-pinned 1). Slightly low
# for more deterministic code reviews.
temperature = 0.3
# Reasoning models can take a while on real diffs; keep a generous timeout
# (litellm.Timeout in run 31629721723 with the default 120s).
ai_timeout = 600
