name: NPU Driver Reset + Benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reset-and-bench:
    runs-on: [self-hosted, strix-halo]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Stop services
        run: |
          # Production embed-server is a user service (embed-server.service,
          # port 8088) and can hold /dev/accel/accel0, which blocks the NPU
          # driver unload below. Stop it first. (1bit-systems.service /
          # unified-router.service no longer exist on this box.)
          sudo -u bcloud env XDG_RUNTIME_DIR=/run/user/1000 systemctl --user stop embed-server.service 2>/dev/null || true
          sleep 2
      - name: Swap firmware and reload driver
        run: |
          sudo mv /lib/firmware/amdnpu/17f0_11/npu_7.sbin /lib/firmware/amdnpu/17f0_11/npu_7.sbin.custom 2>/dev/null || echo "already moved"
          sudo rmmod amdxdna 2>/dev/null || true
          sudo modprobe amdxdna
          sleep 3
          dmesg | tail -10
      - name: Record the driver parameters the reload picked up
        # The reload above re-reads /etc/modprobe.d. A box without the entry that
        # carries `timeout_in_sec=15` comes back at the driver default (2 s) without
        # saying so — the condition benchmarks/RESULTS-ert-rootcause-and-repair-2026-09-16.md
        # attributes the 83-dump ERT teardown to — and the benchmark below then
        # measures a different environment than the published numbers were taken in
        # (#2556). Until now this workflow reset the NPU and recorded nothing about
        # what it reset it to.
        # Reported, not enforced: this is also the recovery path for a hung NPU, and
        # blocking recovery on a config file would be the worse failure. MODPROBE_D
        # is overridable so both branches can be exercised.
        env:
          MODPROBE_D: /etc/modprobe.d
        run: |
          set -uo pipefail
          params=/sys/module/amdxdna/parameters
          td=$(cat "$params/timeout_in_sec" 2>/dev/null || echo '?')
          cl=$(cat "$params/context_limit" 2>/dev/null || echo '?')
          src=$(grep -rls 'timeout_in_sec' "$MODPROBE_D" 2>/dev/null | tr '\n' ' ')
          echo "driver after reload: kernel=$(uname -r) timeout_in_sec=$td context_limit=$cl"
          echo "modprobe.d carrying timeout_in_sec: ${src:-<none>}"
          {
            echo "### NPU driver after reset"
            echo ""
            echo "| parameter | value |"
            echo "| --- | --- |"
            echo "| kernel | \`$(uname -r)\` |"
            echo "| timeout_in_sec | \`$td\` |"
            echo "| context_limit | \`$cl\` |"
            echo "| modprobe.d source | \`${src:-none}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$src" ]; then
            echo "::warning::nothing under $MODPROBE_D sets timeout_in_sec: this reload used the driver default (2 s), so numbers from this run are not like-for-like against the results annotated timeout_in_sec=15 (#2556)"
          fi
      - name: Build engine
        run: |
          source env.sh
          cmake -B build -G Ninja
          cmake --build build --target npu_engine_universal -j$(nproc)
        working-directory: engine/npu
      - name: Run benchmark
        run: |
          timeout 120 ./engine/npu/build/npu_engine_universal /home/bcloud/.config/flm/models/Qwen3-0.6B-NPU2/model.q4nx 32 2>&1 | tee /tmp/npu_bench_result.txt
      - name: Restore services
        if: always()
        run: |
          sudo -u bcloud env XDG_RUNTIME_DIR=/run/user/1000 systemctl --user start embed-server.service 2>/dev/null || true
