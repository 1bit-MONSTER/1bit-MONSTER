name: video-lora CI

on:
  push:
    branches: [main]
    paths:
      - 'tools/video-lora/**'
      - '.github/workflows/video-lora-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/video-lora/**'
      - '.github/workflows/video-lora-ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build + selftest (pure C++)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Vulkan SDK (glslc + headers)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools libvulkan-dev

      - name: Configure
        working-directory: tools/video-lora/vulkan
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: tools/video-lora/vulkan
        run: cmake --build build -j8

      # Shader compile check: every .comp must build to valid SPIR-V.
      # (Selftest needs a GPU — run locally on strix-halo:
      # cd tools/video-lora/vulkan && cmake -B build && cmake --build build -j8
      # && ./build/video_lora_vk_cli --selftest --shaders build/shaders)
      - name: Shader artifacts produced
        working-directory: tools/video-lora/vulkan
        run: |
          ls build/shaders/*.spv
          test "$(ls build/shaders/*.spv | wc -l)" -eq 6
