name: Release

on:
  push:
    branches: ['main']   # rebuild + republish GHCR packages on every main push
  workflow_dispatch:     # manual rebuild + republish (no git tag, no GitHub Release)

permissions: {}

jobs:
  server:
    name: Build release (C++ HIP kernels + server + CLI) — TheRock 7.15.0a
    runs-on: ubuntu-24.04
    # Bare runner, not a container: the `ubuntu:24.04` container image stopped
    # shipping git, which broke actions/checkout's submodule clone. The runner
    # has git and no system ROCm, so TheRock 7.15.0a (installed below) stays the
    # ONLY ROCm in the build — same environment CI's C++ job uses.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write    # push OCI packages to GHCR (no releases, no tags)
    defaults:
      run:
        shell: bash -leo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Install build tools + TheRock nightly ROCm
        run: |
          sudo apt-get update -qq
          # Same dep set as CI's cpp job (proven on this runner): libdrm-dev
          # for lemonade's amdxdna (drm.h), glslc + spirv-headers for zinc_cpp
          # and ggml-vulkan, python3-venv for the TheRock SDK venv.
          sudo apt-get install -y -qq git cmake ninja-build build-essential \
            python3 python3-venv libcurl4-openssl-dev libzstd-dev libwebsockets-dev \
            libvulkan-dev glslc uuid-dev libdrm-dev spirv-headers

          # XRT is what makes the native NPU worker a target at all:
          # CMakeLists.txt gates add_subdirectory(engine/npu) on an XRT probe.
          #
          # NOTE (2026-09-14, measured on the release run for c08e51b0d): Ubuntu
          # noble's libxrt-dev is XRT **2.13**, which ships the *old* header layout
          # (/usr/include/xrt/experimental/*.h and xrt/xrt/*), not the
          # `xrt/xrt_device.h` this tree includes — the configure step logs
          # "Looking for xrt/xrt_bo.h - not found" and
          # "npu: XRT NOT found — skipping NPU engine build", so
          # `ninja -C build npu_engine_universal` fails with "unknown target".
          # AMD publishes XRT as source/RPM only (repo.radeon.com/xrt 404s), so
          # this step alone cannot enable the worker today; it is kept so the
          # build starts working the moment a real XRT (>= 2.14, e.g. AMD's
          # /opt/xilinx/xrt tree, which engine/npu prefers anyway) is present.
          sudo apt-get install -y -qq libxrt-dev || \
            echo "::warning::libxrt-dev unavailable — this release will not include the NPU worker (npu_engine_universal)"

          # Make the reason visible in every release log instead of leaving it to
          # be inferred from a silent warning.
          echo "npu worker prerequisites:"
          echo "  /usr/include/xrt/xrt_device.h : $([ -f /usr/include/xrt/xrt_device.h ] && echo yes || echo NO)  (noble libxrt-dev is XRT 2.13: experimental layout only)"
          echo "  /opt/xilinx/xrt               : $([ -d /opt/xilinx/xrt ] && echo yes || echo NO)  (AMD layout this tree targets)"
          echo "  dpkg libxrt-dev               : $(dpkg-query -W -f='${Version}' libxrt-dev 2>/dev/null || echo none)"

          # Install TheRock nightly ROCm SDK (AMD's C++ toolchain for Strix Halo).
          # TheRock 7.15.0a (with the built-in FastFlowLM flm binary) is the ONLY
          # ROCm in this build — the runner has no system ROCm, so CMake's
          # /opt/rocm fallback can never be reached. CMakeLists.txt auto-detects
          # /opt/rocm-therock.
          sudo python3 -m venv /opt/rocm-therock
          sudo /opt/rocm-therock/bin/pip install \
            "rocm[libraries,devel,device-gfx1151]" \
            --index-url https://rocm.nightlies.amd.com/whl-multi-arch/
          sudo /opt/rocm-therock/bin/rocm-sdk init

      - name: Build all C++ targets (TheRock 7.15.0a HIP kernels + servers + CLI)
        run: |
          # TheRock installs into a Python venv at /opt/rocm-therock.
          # Find the Python site-packages directory (version-dependent) and
          # set all the paths CMakeLists.txt needs to discover TheRock.
          THEROCK_ROOT="/opt/rocm-therock"
          PYTHON_SITE="$(dirname "$(find "$THEROCK_ROOT/lib" -name '_rocm_sdk_devel' -type d 2>/dev/null | head -1)")"
          echo "TheRock site-packages: $PYTHON_SITE"

          export ROCM_PATH="$PYTHON_SITE/_rocm_sdk_devel"
          export HIP_PATH="$ROCM_PATH"
          export ROCM_CORE_PATH="$PYTHON_SITE/_rocm_sdk_core"
          export ROCM_LIB_PATH="$PYTHON_SITE/_rocm_sdk_libraries"
          export ROCM_DEVICE_LIBS_PATH="$PYTHON_SITE/_rocm_sdk_device_gfx1151"
          export LLVM_PATH="$ROCM_PATH/lib/llvm"
          export PATH="$ROCM_PATH/bin:$ROCM_CORE_PATH/bin:$THEROCK_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$ROCM_PATH/lib:$ROCM_CORE_PATH/lib:$ROCM_LIB_PATH/lib:$LD_LIBRARY_PATH"
          export HIP_DEVICE_LIB_PATH="$ROCM_CORE_PATH/lib/llvm/amdgcn/bitcode"
          export CFLAGS="-D__HIP_PLATFORM_AMD__ -I$ROCM_PATH/include"
          export CXXFLAGS="-D__HIP_PLATFORM_AMD__ -I$ROCM_PATH/include"
          export CPATH="$ROCM_PATH/include:$CPATH"

          echo "ROCM_PATH=$ROCM_PATH"
          echo "amdclang++: $(which amdclang++)"
          echo "hipcc: $(which hipcc)"
          echo "HIP version: $($ROCM_PATH/bin/hipconfig --version 2>/dev/null || echo 'N/A')"

          cmake -B build -G Ninja \
            -DEMBED_LEMONADE=ON \
            -DCMAKE_HIP_ARCHITECTURES=gfx1151 \
            -DCMAKE_PREFIX_PATH="$ROCM_PATH" \
            -DCMAKE_CXX_FLAGS="-I$ROCM_PATH/include" \
            -DCMAKE_HIP_FLAGS="--rocm-path=$ROCM_PATH"
          # Build the core library and the single onebin/1bit ELF (every
          # server + CLI dispatched by subcommand — no separate binaries).
          ninja -C build \
            rocm_cpp \
            onebin \
            bitnet_tui
          # Native NPU worker — the lane the engine's own NPU path fork/execs
          # (src/backend_npu.cpp). The target only exists when CMake found XRT, so
          # this is best-effort: a miss downgrades the package to CPU/GPU instead of
          # failing the release.
          ninja -C build npu_engine_universal || \
            echo "::warning::npu_engine_universal not built (XRT missing?) — the release ships without the NPU worker"

      - name: Package
        run: |
          mkdir -p dist/bin dist/lib
          # One binary: every server + CLI (zaya, unified, router, jarvis,
          # vision, onebitd, onebit) dispatched by subcommand.
          cp build/1bit dist/bin/
          # TUI frontend (separate binary, not folded into onebin)
          cp build/bitnet_tui dist/bin/ 2>/dev/null || true
          # Native NPU worker, when this build could produce it. It sits next to
          # `1bit` in bin/, so the engine resolves it from the executable's own
          # directory with no NPU_ENGINE_BIN (include/npu_worker_path.h); the .deb
          # and AppImage inherit it from dist/bin. Issue #2360.
          # The path matters: `ninja -C build npu_engine_universal` writes
          # build/engine/npu/npu_engine_universal, while this step used to look
          # for build/npu_engine_universal — so the copy never fired and every
          # release shipped without the worker even when the build had produced
          # one. Both layouts are checked, main build first.
          npu_worker=""
          for cand in build/engine/npu/npu_engine_universal build/npu_engine_universal; do
            if [ -f "$cand" ]; then npu_worker="$cand"; break; fi
          done
          # No XRT on this runner, so the build normally cannot produce one: fall
          # back to the vendored prebuilt, verifying it against the manifest. This
          # is what keeps the packages from being CPU/GPU-only (issue #2360).
          if [ -z "$npu_worker" ] && [ -f packaging/prebuilt/npu_engine_universal ]; then
            want="$(python3 -c 'import json;print(json.load(open("packaging/prebuilt/manifest.json"))["files"]["npu_engine_universal"]["sha256"])')"
            got="$(sha256sum packaging/prebuilt/npu_engine_universal | cut -d' ' -f1)"
            if [ "$want" != "$got" ]; then
              echo "::error::vendored NPU worker sha256 mismatch (manifest $want != file $got)"
              exit 1
            fi
            npu_worker=packaging/prebuilt/npu_engine_universal
            echo "npu worker: vendored prebuilt (this build had no XRT)"
          fi
          if [ -n "$npu_worker" ]; then
            cp "$npu_worker" dist/bin/npu_engine_universal
            # The worker's RUNPATH is $ORIGIN:$ORIGIN/../lib/1bit, so the bundled
            # OpenMP runtime must sit at lib/1bit/libomp.so in the flat layout
            # (usr/bin + usr/lib/1bit once unpacked) — see packaging/README.md.
            mkdir -p dist/lib/1bit
            cp packaging/prebuilt/libomp.so dist/lib/1bit/libomp.so
            echo "packaged: bin/npu_engine_universal (from $npu_worker) + lib/1bit/libomp.so"
          else
            echo "::warning::no npu_engine_universal — this release ships without the NPU worker"
          fi
          # Shared HIP kernel library
          cp build/librocm_cpp.so dist/lib/
          # Docs + install + license
          cp install.sh dist/
          cp README.md dist/
          cp LICENSE dist/
          cp site/assets/logo.png dist/
          # Loader script so binaries find librocm_cpp.so next to the tarball
          # without the user hand-setting LD_LIBRARY_PATH. Single source of
          # truth: packaging/tarball-run.sh — packaging/Makefile's `stage`
          # target installs the same file as run.sh in the website tarball, and
          # it detects this flat bin/+lib/ layout as well as that FHS one, so
          # the two artifacts can no longer drift (the website .tar.xz had no
          # run.sh at all while the docs told users to run ./run.sh).
          cp packaging/tarball-run.sh dist/run.sh
          chmod +x dist/run.sh
          tar czf 1bit-linux-x86_64.tar.gz -C dist .

      - name: Build .deb package
        run: |
          # packaging/deb/DEBIAN/control's Version: field is kept in sync with
          # the root VERSION file by scripts/sync-version.sh (issue #117,
          # enforced by the "Version consistency" CI check) — not templated
          # here, so it can't silently drift from what that check expects.
          VERSION="$(tr -d '[:space:]' < VERSION)"
          rm -rf deb-build
          cp -r packaging/deb deb-build

          mkdir -p deb-build/usr/bin deb-build/usr/lib/1bit-monster deb-build/usr/lib/1bit deb-build/etc/ld.so.conf.d
          cp dist/bin/* deb-build/usr/bin/
          cp -r dist/lib/* deb-build/usr/lib/1bit-monster/
          # dist/lib/1bit holds the NPU worker's bundled libomp.so; the worker's
          # RUNPATH looks in $ORIGIN/../lib/1bit, i.e. /usr/lib/1bit here.
          cp -r dist/lib/1bit/. deb-build/usr/lib/1bit/ 2>/dev/null || true
          printf '/usr/lib/1bit-monster\n/usr/lib/1bit\n' > deb-build/etc/ld.so.conf.d/1bit-monster.conf

          chmod 755 deb-build/DEBIAN/postinst
          dpkg-deb --build --root-owner-group deb-build "1bit-monster_${VERSION}_amd64.deb"

      - name: Build AppImage
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          curl -sL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          rm -rf appimage-build
          cp -r packaging/appimage/AppDir appimage-build
          mkdir -p appimage-build/usr/bin appimage-build/usr/lib
          cp dist/bin/* appimage-build/usr/bin/
          cp -r dist/lib/* appimage-build/usr/lib/
          chmod +x appimage-build/AppRun

          # appimagetool needs FUSE, unavailable in most CI containers —
          # extract-and-run avoids mounting a FUSE filesystem.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run appimage-build \
            "1bit-monster-${VERSION}-x86_64.AppImage"

      - name: Publish packages to GHCR (no releases, no tags)
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SHA="$(git rev-parse --short HEAD)"
          # oras is not preinstalled on runners; fetch the binary (a tool
          # download — unrelated to GitHub Releases).
          curl -sL -o oras.tgz https://github.com/oras-project/oras/releases/download/v1.2.2/oras_1.2.2_linux_amd64.tar.gz
          tar -xzf oras.tgz oras
          chmod +x oras
          echo "$GHCR_TOKEN" | ./oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          ARTIFACT="ghcr.io/1bit-monster/1bit-monster"
          # Rolling + immutable tags. No git tags, no GitHub Release.
          for TAG in latest sha-${SHA}; do
            ./oras push "${ARTIFACT}:${TAG}" \
              --artifact-type application/vnd.1bit.package \
              1bit-linux-x86_64.tar.gz:application/gzip \
              1bit-monster_${VERSION}_amd64.deb:application/vnd.debian.binary-package \
              1bit-monster-${VERSION}-x86_64.AppImage:application/vnd.appimage
            echo "published ${ARTIFACT}:${TAG}"
          done
          echo ""
          echo "Packages: https://github.com/orgs/1bit-MONSTER/packages?repo_name=1bit-MONSTER"
          echo "Pull any time with:"
          echo "  oras pull ghcr.io/1bit-monster/1bit-monster:latest"
