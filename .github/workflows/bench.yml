name: NPU Benchmark

on:
  workflow_dispatch:
    inputs:
      model_path:
        description: 'Path to Q4NX model file'
        required: false
        default: ''
      decode_tokens:
        description: 'Decode tokens to generate'
        required: false
        default: '32'
      allow_default_tdr:
        # The benchmark's environment precondition (#2556): the driver's TDR timeout
        # must be the raised value the published numbers were taken at. Set this to
        # measure the 2 s default on purpose — the run then says so in a warning.
        description: 'Run even when amdxdna timeout_in_sec is the 2 s default'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/bench.yml'
      # Everything the engine build READS, not only its sources. The job's own
      # compile line also pulls headers from engine/npu/{include,generators},
      # include/ and npu-infer/{include,src}, so a change to any of those moves
      # the binary and has to re-run this. `engine/npu/**` additionally covers
      # CMakeLists.txt and build_npu.sh — the two other descriptions of this same
      # build (#2505) — which previously could change without firing this job at
      # all. Checked by the paths-coverage rule in Testing/repo_docs_selfcheck.py.
      - 'engine/npu/**'
      - 'npu-infer/**'
      - 'include/**'

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    # [self-hosted, strix-halo], not bare `self-hosted`, because this repo has TWO
    # self-hosted runners and only one of them has the NPU. Bare `self-hosted` matched
    # ryzen-pr-agent too, where `ldconfig` finds no XRT, so `Check XRT` set XRT_OK=false,
    # every step below it was SKIPPED by its `if: env.XRT_OK == 'true'`, and the job
    # reported SUCCESS having built and benchmarked nothing — measured on runs
    # 35299194441 and 35298939536 (runner=ryzen-pr-agent, "Build engine: skipped",
    # "Benchmark: skipped", conclusion=success). That is the false green in #2508, and it
    # was 42 of the last 60 runs. end-to-end-smoke.yml already pins this label for the
    # same reason; this workflow was the only one still on the bare label.
    runs-on: [self-hosted, strix-halo]
    timeout-minutes: 60
    if: github.event.repository.owner.login == '1bit-MONSTER'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check NPU driver
        run: |
          if ! ls /dev/accel/accel* >/dev/null 2>&1; then
            # A job named "NPU Benchmark" concluding success without a device claims a
            # measurement that does not exist (#2508). The step skipped below, so fail
            # here, where the reason is visible.
            echo "::error::NPU device not found — no benchmark can be measured on this runner (#2508). Driver may need reload."
            echo "DRIVER_OK=false" >> $GITHUB_ENV
            exit 1
          else
            echo "NPU device present"
            echo "DRIVER_OK=true" >> $GITHUB_ENV
          fi

      - name: Check the measurement precondition (amdxdna TDR)
        # Every 35B/dense number published since 2026-09-16 is annotated
        # `timeout_in_sec=15`; the driver's 2 s default is the condition
        # benchmarks/RESULTS-ert-rootcause-and-repair-2026-09-16.md attributes the
        # 83-dump ERT_CMD_STATE_TIMEOUT teardown to. That value lives in an untracked
        # /etc/modprobe.d file, so a runner without it measures a different environment
        # than the numbers were taken in, and says nothing about it (#2556). Asserted
        # rather than assumed: a benchmark whose environment is unknown is not evidence.
        #
        # TDR_PARAM is overridable so the failure path can be exercised without
        # touching the host's module parameter.
        env:
          ALLOW_DEFAULT_TDR: ${{ inputs.allow_default_tdr == true && '1' || '' }}
        run: |
          tdr_param="${TDR_PARAM:-/sys/module/amdxdna/parameters/timeout_in_sec}"
          tdr=$(cat "$tdr_param" 2>/dev/null || echo '?')
          echo "amdxdna timeout_in_sec = $tdr (from $tdr_param)"
          # Printed so the override's own state is in the log: an override that is on
          # without anyone noticing is how this precondition would become advisory.
          echo "allow_default_tdr override: '${ALLOW_DEFAULT_TDR:-<unset>}'"
          {
            echo "### NPU benchmark environment"
            echo ""
            echo "| parameter | value |"
            echo "| --- | --- |"
            echo "| kernel | \`$(uname -r)\` |"
            echo "| amdxdna timeout_in_sec | \`$tdr\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$tdr" in
            2|'?')
              if [ -n "$ALLOW_DEFAULT_TDR" ]; then
                echo "::warning::timeout_in_sec=$tdr (the 2 s default, or unreadable) and allow_default_tdr was set: running anyway, so any number from this run is not like-for-like against the results annotated timeout_in_sec=15 (#2556)."
              else
                echo "::error::timeout_in_sec=$tdr — the measurement precondition is not met, so this run cannot produce a number comparable to the published set (#2556). On the runner: ensure a /etc/modprobe.d entry sets 'options amdxdna timeout_in_sec=15' and reload the module. To measure the default deliberately, re-dispatch with allow_default_tdr=true."
                exit 1
              fi
              ;;
          esac
          echo "measurement precondition met (timeout_in_sec=$tdr)"

      - name: Check XRT
        run: |
          if ! ldconfig -p | grep -q xrt_coreutil; then
            echo "::error::XRT not found in ldconfig — the engine cannot be built or run here, so no benchmark can be measured (#2508)."
            echo "XRT_OK=false" >> $GITHUB_ENV
            exit 1
          else
            echo "XRT found"
            echo "XRT_OK=true" >> $GITHUB_ENV
          fi

      - name: Build engine (continuous batch)
        if: env.XRT_OK == 'true'
        run: |
          # Build the engine through its own CMake target instead of re-listing its
          # sources here. That list was a hand-maintained copy of
          # engine/npu/CMakeLists.txt's NPU_ENGINE_SOURCES and build_npu.sh's
          # ENGINE_OBJS, and it drifted: #2435 added three bridge TUs to both of
          # those and to neither here, and the only signal was this job failing to
          # link with 26 undefined references (#2505). Reading the target means a
          # source added to the engine is compiled here by construction.
          #
          # It also replaces a stale copy: this build linked npu-infer/src/flm_bridge.cpp,
          # which CMakeLists.txt dropped on 2026-08-15 ("no engine code calls
          # FlmBridge"), and it built with slightly different flags than the engine
          # that ships. A benchmark should measure the shipped build.
          #
          # Cost: 17 s for configure+build here, against ~30 s for the hand-rolled
          # g++ it replaces. The dequantizer is no longer a separate step — the
          # target already compiles dequant_q4nx.cpp into the binary.
          cmake -S engine/npu -B engine/npu/build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/npu/build-cmake --target npu_engine_universal -j"$(nproc)"
          ls -la engine/npu/build-cmake/npu_engine_universal

      - name: Benchmark
        if: env.DRIVER_OK == 'true'
        env:
          MODEL_PATH: ${{ github.event.inputs.model_path || '' }}
          DEC: ${{ github.event.inputs.decode_tokens || '32' }}
          # The engine resolves xclbins through NPU_XCLBIN_DIR when it is set, and otherwise
          # through an installed layout — `~/.local/share/1bit-monster/xclbins`, which on this
          # runner is EMPTY (0 files). That is why every candidate failed with `FAIL QKV`
          # (run 35299693789) even though the repo ships the artifacts they need: 374 xclbins,
          # including the complete Qwen3-4B set (QKV K2560 N6144, O K2560 N2560, G/U K2560
          # N9728, D K9728 N2560). The job builds from the repo, so it has to read from it.
          NPU_XCLBIN_DIR: ${{ github.workspace }}/engine/npu/xclbins
        run: |
          # Candidate models. The list is ordered, but "the file exists" is NOT the property
          # that decides whether this job can measure anything: the engine resolves xclbins
          # through NPU_XCLBIN_DIR, then a CWD-RELATIVE repo path, then the installed layout, and
          # a model whose artifacts are not in whichever of those wins cannot init at all.
          #
          # Measured before the fix (run 35299693789, runner=strixhalo-pr-agent): all four
          # candidates died at FAIL QKV. The step does `cd engine/npu/build-cmake`, so the
          # repo-relative fallback missed, and the installed layout it fell back to holds 0 files.
          # Selecting by file existence alone therefore picked a model that could not run on this
          # runner - which is how this job spent its life concluding success without a measurement
          # (#2508), and why the honest version of it goes red.
          #
          # The artifacts were never missing: this repo tracks the tag-keyed set for every
          # candidate below (final_i8_QKV_qwen3_0_6b.xclbin and friends - it is the
          # DIMENSION-keyed spelling final_i8_QKV_K1024_N4096.xclbin that does not exist, which is
          # what a `grep K1024` finds). A search path, not a coverage gap: #2484 is a separate
          # question, and the fix is one environment variable rather than a build.
          candidates=()
          if [ -n "$MODEL_PATH" ]; then
            candidates+=("$MODEL_PATH")      # explicit request: one attempt, no fallback
          else
            for candidate in \
              "$HOME/.config/flm/models/Qwen3-0.6B-NPU2/model.q4nx" \
              "$HOME/.config/flm/models/Qwen3-1.7B-NPU2/model.q4nx" \
              "$HOME/.config/flm/models/Qwen3-4B-NPU2/model.q4nx" \
              "$HOME/models/qwen3-0.6b.q4nx" \
              "$HOME/models/zaya1-8b.q4nx"; do
              if [ -f "$candidate" ]; then
                candidates+=("$candidate")
                echo "Candidate model: $candidate"
              fi
            done
          fi
          if [ ${#candidates[@]} -eq 0 ]; then
            echo "::error::No Q4NX model found. Pass model_path via workflow_dispatch or place a .q4nx model on the runner."
            exit 1
          fi
          # Validate user-supplied decode_tokens: must be a positive integer
          case "$DEC" in
            ''|*[!0-9]*) echo "::error::decode_tokens must be a positive integer, got '$DEC'"; exit 1 ;;
          esac
          echo "=== NPU Benchmark $(date -u) ==="
          echo "Decode tokens: $DEC"
          cd engine/npu/build-cmake
          # `| tee` discards the engine's status and `grep || echo` discards the
          # measurement's, so every way this can fail to measure - an init failure
          # (`return 1` below init_i8/init_bf16), a crash, no xclbin for this shape -
          # used to land on a green job (#2508). Both are checked now, per candidate.
          measured=""
          reasons=""
          for m in "${candidates[@]}"; do
            echo "--- trying: $m"
            set +e
            OMP_NUM_THREADS=16 ./npu_engine_universal "$m" "$DEC" 2>&1 | tee benchmark.log
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ] && grep -q "ms/tok" benchmark.log; then
              measured="$m"; break
            fi
            # Separate the two failure kinds. A missing artifact is a property of the MODEL
            # CHOICE, so trying the next candidate is the fix. Anything else is a breakage, and
            # must not be masked by quietly falling through to a different model.
            if grep -q "No such file" benchmark.log && grep -qi "xclbin" benchmark.log; then
              miss=$(grep -o "No such file '[^']*'" benchmark.log | head -1)
              echo "::warning::$m cannot be benchmarked here - $miss (#2484)"
              reasons="$reasons
            $m -> $miss"
              continue
            fi
            echo "::error::the engine exited $rc without completing a benchmark on $m - the log above says why"
            exit 1
          done
          if [ -z "$measured" ]; then
            echo "::error::no candidate model could be benchmarked: every one is missing an xclbin for its shape (#2484).$reasons"
            exit 1
          fi
          echo "Model: $measured"
          echo "--- measurement:"
          grep "ms/tok" benchmark.log | tail -3

      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-log
          path: engine/npu/build-cmake/benchmark.log
          retention-days: 30

      # This step used to `sed -i` a "Benchmarks run <now> — CI-verified" line into
      # engine/npu/BENCHMARKS.md. It could not affect the repository, or even the
      # workspace copy, and it reported success the whole time. Introduced in
      # 200e4694a (2026-08-21) and never accompanied by a commit step:
      #   1. `permissions: contents: read` (line 21) and no commit/push step, so a
      #      modified tracked file is discarded with the runner workspace. The 8
      #      workflows here that do write back all declare a write permission;
      #      this one never did.
      #   2. The pattern `^\*Benchmarks` matches no line in BENCHMARKS.md —
      #      `git log -S '*Benchmarks run' -- engine/npu/BENCHMARKS.md` is empty,
      #      so `sed -i` exited 0 having changed nothing.
      #   3. `if: env.DRIVER_OK == 'true'` skipped it whenever the driver was
      #      missing: a step recorded as a skip and read as a pass.
      # The run summary is a record CI can actually write, so the timestamp goes
      # there. A tracked-file stamp would need a write token and a commit step,
      # which this repo deliberately does not give its PR-triggered workflows.
      - name: Record the verification timestamp
        if: always()
        run: |
          {
            echo "### NPU benchmark — $(date -u +'%Y-%m-%d %H:%M UTC')"
            log=engine/npu/build-cmake/benchmark.log
            if [ -s "$log" ]; then
              if grep -q "ms/tok" "$log"; then
                echo "- measured: $(grep 'ms/tok' "$log" | tail -1)"
              else
                echo "- no ms/tok line in benchmark.log — this run produced no measurement"
              fi
            else
              echo "- no benchmark.log — the engine never ran"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
