name: Site Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fetch Cloudflare analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WA_TOKEN: ${{ secrets.CLOUDFLARE_WA_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TOKEN="$CLOUDFLARE_API_TOKEN"
          ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          H="Authorization: Bearer $TOKEN"
          api() { curl -s -H "$H" "$@"; }

          # RUM data queries go through the GraphQL Analytics API, which
          # authenticates with the Account Analytics: Read permission (a
          # standard token permission). Prefer the dedicated
          # CLOUDFLARE_WA_TOKEN when it is set; otherwise fall back to the
          # Pages token (which fails with a clear error message).
          RUM_TOKEN="${CLOUDFLARE_WA_TOKEN:-$TOKEN}"
          gql() {
            curl -s -X POST "https://api.cloudflare.com/client/v4/graphql" \
              -H "Authorization: Bearer $RUM_TOKEN" -H "Content-Type: application/json" \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$1")"
          }

          echo "=== Cloudflare Pages: 1bit-monster ==="
          api "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/1bit-monster" | \
            jq '{ name: .result.name, domains: .result.domains }'

          echo ""
          echo "=== Deployments (last 3) ==="
          api "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/1bit-monster/deployments?per_page=3" | \
            jq '[.result[]? | { created_on, url, latest_stage: ([.stages[]? | select(.ended_on == null) | .name] | first // "done") }]'

          echo ""
          echo "=== Web Analytics (RUM) ==="
          # The RUM site token is public by design (it ships inside the beacon on
          # every page), so read it from the committed beacon loader instead of the
          # rum/site_info/list API (which needs a token with the Web Analytics
          # permission group that the Pages deploy token does not have).
          SITE_TOKEN=$(sed -n 's/.*var TOKEN = "\([0-9a-f]\{32\}\)".*/\1/p' site/analytics.js | head -1)

          if [ -z "$SITE_TOKEN" ]; then
            echo "No beacon token found in site/analytics.js — inject it first (see the CF Web Analytics Bootstrap workflow)."
            exit 0
          fi
          echo "Site token: ${SITE_TOKEN:0:8}… (read from site/analytics.js)"

          TODAY=$(date -u +%Y-%m-%d)
          FROM=$(date -u -d "7 days ago" +%Y-%m-%d)
          echo "Window: $FROM .. $TODAY"

          echo ""
          echo "--- Totals ---"
          TOTAL_JSON=$(gql "{ viewer { accounts(filter: {accountTag: \"$ACCOUNT_ID\"}) { rumPageloadEventsAdaptiveGroups(limit: 1, filter: {siteTag: \"$SITE_TOKEN\", date_geq: \"$FROM\", date_leq: \"$TODAY\"}) { sum { visits } } } } }")
          TOTAL_VISITS=$(echo "$TOTAL_JSON" | jq -r '.data.viewer.accounts[0].rumPageloadEventsAdaptiveGroups[0].sum.visits // 0')
          echo "Total visits: $TOTAL_VISITS (window $FROM .. $TODAY)"
          echo "$TOTAL_JSON" | jq -r 'if .errors then "query errors: \(.errors[0].message)" else empty end'

          echo ""
          echo "--- Top pages ---"
          gql "{ viewer { accounts(filter: {accountTag: \"$ACCOUNT_ID\"}) { rumPageloadEventsAdaptiveGroups(limit: 10, filter: {siteTag: \"$SITE_TOKEN\", date_geq: \"$FROM\", date_leq: \"$TODAY\"}, orderBy: [sum_visits_DESC]) { dimensions { requestPath } sum { visits } } } } }" | \
            jq -r 'if .data then ([.data.viewer.accounts[0].rumPageloadEventsAdaptiveGroups[] | { path: .dimensions.requestPath, views: .sum.visits }] | sort_by(-.views) | .[:10][] | "\(.views)\t\(.path)") else "RUM query failed: \(.errors[0].message // "unknown")" end'

          echo ""
          echo "--- Top referrers (how people got here) ---"
          gql "{ viewer { accounts(filter: {accountTag: \"$ACCOUNT_ID\"}) { rumPageloadEventsAdaptiveGroups(limit: 10, filter: {siteTag: \"$SITE_TOKEN\", date_geq: \"$FROM\", date_leq: \"$TODAY\"}, orderBy: [sum_visits_DESC]) { dimensions { refererHost } sum { visits } } } } }" | \
            jq -r 'if .data then ([.data.viewer.accounts[0].rumPageloadEventsAdaptiveGroups[] | { referer: .dimensions.refererHost, views: .sum.visits }] | sort_by(-.views) | .[:10][] | "\(.views)\t\(.referer)") else "RUM query failed: \(.errors[0].message // "unknown")" end'

          echo ""
          echo "--- RUM health check (token drift detection) ---"
          # If the beacon token reports no data but the account has RUM data, the
          # site token in analytics.js has drifted from the real RUM site. Discover
          # the actual siteTag(s) so the report keeps working (2026-08-26: the
          # beacon was serving a stale token 33fb8448… while the real RUM site
          # 87349337… collected the data).
          if [ "${TOTAL_VISITS:-0}" -eq 0 ] 2>/dev/null; then
            echo "⚠ Site token ${SITE_TOKEN:0:8}… has NO data in this window — checking for token drift:"
            gql "{ viewer { accounts(filter: {accountTag: \"$ACCOUNT_ID\"}) { rumPageloadEventsAdaptiveGroups(limit: 10, filter: {date_geq: \"$FROM\", date_leq: \"$TODAY\"}, orderBy: [sum_visits_DESC]) { dimensions { siteTag requestPath } sum { visits } } } } }" | \
              jq -r 'if .data then
                       ([.data.viewer.accounts[0].rumPageloadEventsAdaptiveGroups[] |
                         { tag: .dimensions.siteTag, path: .dimensions.requestPath, views: .sum.visits }]
                        | .[] | "\(.tag[0:8])…\t\(.views)\t\(.path)")
                     else "health query failed: \(.errors[0].message // "unknown")" end'
          else
            echo "Site token has data — no drift detected."
          fi

          echo ""
          echo "--- Attribution: who shared what (share.html links) ---"
          # share.html links carry the attribution in the PATH (/s/<sharer>/<team>/<medium>)
          # because Cloudflare Web Analytics does not log query strings (documented
          # limitation). 404.html fires the RUM beacon on the /s/ URL, so requestPath
          # records the full attribution before redirecting to the target.
          ATTRIBUTION_JSON=$(gql "{ viewer { accounts(filter: {accountTag: \"$ACCOUNT_ID\"}) { rumPageloadEventsAdaptiveGroups(limit: 50, filter: {siteTag: \"$SITE_TOKEN\", date_geq: \"$FROM\", date_leq: \"$TODAY\"}, orderBy: [sum_visits_DESC]) { dimensions { requestPath } sum { visits } } } } }")
          ATTRIBUTED=$(echo "$ATTRIBUTION_JSON" | jq -r '
            if .data then
              ([.data.viewer.accounts[0].rumPageloadEventsAdaptiveGroups[]
                | select(.dimensions.requestPath != null and (.dimensions.requestPath | startswith("/s/")))
                | .sum.visits] | add // 0)
            else -1 end')
          if [ "$ATTRIBUTED" = "-1" ]; then
            echo "Attribution query failed: $(echo "$ATTRIBUTION_JSON" | jq -r '.errors[0].message // "unknown"')"
          else
            echo "Attributed visits: $ATTRIBUTED of ${TOTAL_VISITS:-0} total (came through tracked share.html links)"
            echo -e "views\tsharer\tteam\tmedium"
            echo "$ATTRIBUTION_JSON" | jq -r '
              if .data then
                ([.data.viewer.accounts[0].rumPageloadEventsAdaptiveGroups[]
                  | select(.dimensions.requestPath != null and (.dimensions.requestPath | startswith("/s/")))
                  | . as $r
                  | ($r.dimensions.requestPath | split("/") | map(select(length > 0))) as $seg
                  | { views: $r.sum.visits,
                      sharer: $seg[1],
                      team: $seg[2],
                      medium: ($seg[3]
                        | if . == "teams" then "Teams"
                          elif . == "discord" then "Discord"
                          elif . == "slack" then "Slack"
                          elif . == "email" then "Email"
                          elif . == "social" then "Social"
                          else . end) }]
                 | sort_by(-.views) | .[:25][])
                | "\(.views)\t\(.sharer)\t\(.team)\t\(.medium)"
              else empty end'
          fi

          echo ""
          echo "=== Zone analytics (1bit.monster — real edge traffic, independent of RUM) ==="
          ZONE_ID=$(curl -s -H "Authorization: Bearer $RUM_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=1bit.monster" | jq -r '.result[0].id // empty')
          if [ -n "$ZONE_ID" ]; then
            echo "Zone: 1bit.monster ($ZONE_ID)"
            gql "{ viewer { zones(filter: {zoneTag: \"$ZONE_ID\"}) { httpRequests1dGroups(limit: 10, filter: {date_geq: \"$FROM\", date_leq: \"$TODAY\"}, orderBy: [date_ASC]) { dimensions { date } sum { requests pageViews } } } } }" | \
              jq -r 'if .data then
                       ([.data.viewer.zones[0].httpRequests1dGroups[] |
                         { date: .dimensions.date, requests: .sum.requests, pageViews: .sum.pageViews }]
                        | .[] | "\(.date)\t\(.requests) req\t\(.pageViews) pv")
                     else "zone analytics query failed: \(.errors[0].message // "unknown")" end'
          else
            echo "Zone 1bit.monster not visible to the analytics token (need Zone: Read on the WA token)."
          fi

          echo ""
          echo "--- Attribution summary (also on the Actions run page) ---"
          if [ "${ATTRIBUTED:-0}" -gt 0 ] 2>/dev/null; then
            {
              echo "### 🎉 Attributed shares this window"
              echo "**$ATTRIBUTED** of ${TOTAL_VISITS:-0} visits came through tracked share.html links — see the run log for who / team / medium."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### 📡 Attribution status"
              echo "No attributed clicks yet — the RUM beacon is still aggregating (< 24h live). Once people use share.html links, this report names the sharer + team + medium."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
