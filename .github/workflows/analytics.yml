name: Site Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Cloudflare analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TOKEN="$CLOUDFLARE_API_TOKEN"
          ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          H="Authorization: Bearer $TOKEN"
          api() { curl -s -H "$H" "$@"; }

          echo "=== Cloudflare Pages: 1bit-monster ==="
          api "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/1bit-monster" | \
            jq '{ name: .result.name, domains: .result.domains }'

          echo ""
          echo "=== Deployments (last 3) ==="
          api "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/1bit-monster/deployments?per_page=3" | \
            jq '[.result[]? | { created_on, url, latest_stage: ([.stages[]? | select(.ended_on == null) | .name] | first // "done") }]'

          echo ""
          echo "=== Web Analytics (RUM) ==="
          SITES=$(api "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/rum/site_info/list")
          echo "$SITES" | jq -r '.result[]? | "site: \(.domain)  token: \(.site_token)"'

          SITE_TOKEN=$(echo "$SITES" | jq -r '.result[]? | select(.domain == "1bit.monster") | .site_token // empty')

          if [ -z "$SITE_TOKEN" ]; then
            echo "No Web Analytics site for 1bit.monster yet — run the 'CF Web Analytics Bootstrap' workflow."
            exit 0
          fi

          TODAY=$(date -u +%Y-%m-%d)
          FROM=$(date -u -d "7 days ago" +%Y-%m-%d)
          echo "Window: $FROM .. $TODAY"

          echo ""
          echo "--- Totals ---"
          api "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/rum/v2/$SITE_TOKEN/totals?dateFrom=$FROM&dateTo=$TODAY" | \
            jq '{ visits: .result.totals.visits, visitors: .result.totals.visitors, pageviews: .result.totals.pageviews, success: .success }'

          echo ""
          echo "--- Top pages ---"
          api "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/rum/v2/$SITE_TOKEN/aggregate?dateFrom=$FROM&dateTo=$TODAY&dimensions=path" | \
            jq -r '[.result.dimensions.path[]? | { path: .key, views: .value }] | sort_by(-.views) | .[:10][] | "\(.views)\t\(.path)"'

          echo ""
          echo "--- Top referrers (how people got here) ---"
          api "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/rum/v2/$SITE_TOKEN/aggregate?dateFrom=$FROM&dateTo=$TODAY&dimensions=referer" | \
            jq -r '[.result.dimensions.referer[]? | { referer: .key, views: .value }] | sort_by(-.views) | .[:10][] | "\(.views)\t\(.referer)"'
