name: SEO Sync

# Daily SEO refresh for the 1bit.MONSTER site. Runs scripts/seo_sync.py,
# which derives the engine's CURRENT numbers offline (HF arch strings, arch
# tokens, checkpoint coverage, vendored lemonade version) and diffs them
# against what site/*.html claims. When something changed (a new HF arch
# alias landed, a family token was added, the census re-swept, or the
# vendored lemonade version bumped) it updates the SEO tags / stats / blog
# card and opens a PR so the change ships to GitHub Pages + Cloudflare Pages.
# No drift -> the run exits quietly and nothing is opened.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'   # 05:30 UTC, before the 06:00 analytics run

permissions:
  contents: write
  pull-requests: write

jobs:
  seo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run SEO sync
        id: sync
        run: |
          set -euo pipefail
          OUT="$(python3 scripts/seo_sync.py)"
          echo "$OUT"
          echo "$OUT" > /tmp/seo_sync_out.txt
          if echo "$OUT" | grep -qE '^(CHANGED|NEW):'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint GitHub App installation token
        if: steps.sync.outputs.changed == 'true'
        id: app-token
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          { [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; } || { echo "::error::APP_ID / APP_PRIVATE_KEY secrets not set — autopr cannot create PRs"; exit 1; }
          B64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          NOW=$(date +%s)
          HEADER=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | B64)
          PAYLOAD=$(printf '{"iat":%s,"exp":%s,"iss":%s}' "$((NOW-60))" "$((NOW+540))" "$APP_ID" | B64)
          SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -sign <(printf '%s' "$APP_PRIVATE_KEY") -binary | B64)
          JWT="$HEADER.$PAYLOAD.$SIG"
          AUTH="Authorization: Bearer $JWT"
          INSTALL_ID=$(curl -s -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations" | \
            jq -r --arg o "$GITHUB_REPOSITORY_OWNER" '.[] | select(.account.login == $o) | .id' | head -1)
          { [ -n "$INSTALL_ID" ]; } || { echo "::error::GitHub App not installed on $GITHUB_REPOSITORY_OWNER"; exit 1; }
          TOKEN=$(curl -s -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/$INSTALL_ID/access_tokens" | jq -r '.token // empty')
          { [ -n "$TOKEN" ]; } || { echo "::error::Could not mint installation token — check app permissions (Contents + Pull requests R/W)"; exit 1; }
          echo "TOKEN=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Open PR when drift found
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.TOKEN }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y%m%d)"
          BRANCH="seo/daily-$DATE"
          if gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q .; then
            echo "PR for $BRANCH already open — nothing to do"
            exit 0
          fi
          # Clear a stale branch left by a previous failed run (no PR -> safe)
          if git ls-remote --exit-code origin "$BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$BRANCH"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add site/ scripts/seo_sync.py
          git commit -m "seo: daily sync $DATE — refresh site claims to current engine state"
          git push origin "$BRANCH"

          BODY="$(cat /tmp/seo_sync_out.txt)"

          _pr_fail() {
            if grep -q "not permitted to create" /tmp/pr_err.txt; then
              echo "::error::GitHub Actions is not permitted to create pull requests. Enable Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests', then re-run."
            else
              cat /tmp/pr_err.txt >&2
            fi
            exit 1
          }

          if echo "$BODY" | grep -q '^NEW:'; then
            # Generated lemonade post: release specifics need a human/PR-agent pass.
            {
              echo "Automated daily SEO refresh (scripts/seo_sync.py). **Draft**: the generated lemonade post carries unverified release specifics — review before merge."
              echo
              echo '```'
              echo "$BODY"
              echo '```'
            } > /tmp/seo_pr_body.md
            if ! gh pr create --base main --head "$BRANCH" --draft \
              --title "seo: daily sync $DATE (lemonade bump)" \
              --body-file /tmp/seo_pr_body.md >/tmp/pr_url.txt 2>/tmp/pr_err.txt; then
              _pr_fail
            fi
          else
            {
              echo "Automated daily SEO refresh (scripts/seo_sync.py). Changes detected:"
              echo
              echo '```'
              echo "$BODY"
              echo '```'
            } > /tmp/seo_pr_body.md
            if ! gh pr create --base main --head "$BRANCH" \
              --title "seo: daily sync $DATE" \
              --body-file /tmp/seo_pr_body.md >/tmp/pr_url.txt 2>/tmp/pr_err.txt; then
              _pr_fail
            fi
          fi
          echo "PR: $(cat /tmp/pr_url.txt)"
