name: Traffic Alert

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'   # daily at 8AM UTC

# Minimal built-in token: this workflow only needs to create spike issues.
# The GitHub Traffic API requires push-level access, but instead of elevating
# the built-in GITHUB_TOKEN to `contents: write` on a schedule-triggered
# workflow (a supply-chain risk — see issue #159), we read traffic with a
# short-lived GitHub App installation token minted from APP_ID +
# APP_PRIVATE_KEY (scoped to `Administration: read` / traffic only). The
# built-in token keeps its least-privilege scope below.
permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  check-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::APP_ID / APP_PRIVATE_KEY secrets not set — skipping traffic fetch."
            echo "TOKEN=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # RS256 JWT signed with the app private key (openssl only, no deps)
          NOW=$(date +%s)
          B64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          HEADER=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | B64)
          PAYLOAD=$(printf '{"iat":%s,"exp":%s,"iss":%s}' "$((NOW-60))" "$((NOW+540))" "$APP_ID" | B64)
          SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -sign <(printf '%s' "$APP_PRIVATE_KEY") -binary | B64)
          JWT="$HEADER.$PAYLOAD.$SIG"
          AUTH="Authorization: Bearer $JWT"
          INSTALL_ID=$(curl -s -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations" | \
            jq -r --arg o "$GITHUB_REPOSITORY_OWNER" '.[] | select(.account.login == $o) | .id' | head -1)
          if [ -z "$INSTALL_ID" ]; then
            echo "::warning::GitHub App not installed on $GITHUB_REPOSITORY_OWNER — install it at https://github.com/apps/1bit-traffice-bot/installations/new"
            echo "TOKEN=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TOKEN=$(curl -s -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/$INSTALL_ID/access_tokens" | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::warning::Could not mint installation token — check the app's permissions"
            echo "TOKEN=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "TOKEN=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Fetch GitHub Traffic Data
        id: traffic
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No app token available — skipping traffic fetch (check APP_ID / APP_PRIVATE_KEY secrets and the app install)."
            # Export empty/default outputs so downstream steps don't crash
            {
              echo "CLONE_14D=0"
              echo "CLONE_UNIQUES_14D=0"
              echo "CLONE_YESTERDAY=0"
              echo "CLONE_YESTERDAY_UNIQ=0"
              echo "VIEW_14D=0"
              echo "VIEW_UNIQUES_14D=0"
              echo "TOP_REFERRER=unavailable (no app token)"
              echo "TOP_PATH=unavailable (no app token)"
              echo "SPIKE=false"
              echo "SPIKE_MSG<<SPIKE_EOF"
              echo "GitHub App token unavailable — check APP_ID / APP_PRIVATE_KEY secrets and the app install"
              echo "SPIKE_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Use github.repository (always available) and extract the repo name
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          API="https://api.github.com/repos/$OWNER/$REPO/traffic"

          # --- Clones ---
          # Fetch traffic data. Fail loudly if API returns empty (likely permissions issue).
          CLONE_RESP=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/clones") || { echo "::error::Traffic API (clones) failed — check GITHUB_TOKEN permissions (need push-level access)"; exit 1; }
          echo "DEBUG: clone response: $(echo "$CLONE_RESP" | head -c 200)"
          CLONE_COUNT=$(echo "$CLONE_RESP" | jq '.count // 0')
          CLONE_UNIQUES=$(echo "$CLONE_RESP" | jq '.uniques // 0')

          # Last 2 days
          LEN=$(echo "$CLONE_RESP" | jq '.clones | length')
          if [ "$LEN" -ge 2 ]; then
            YESTERDAY=$(echo "$CLONE_RESP" | jq '.clones[-2].count // 0')
            YESTERDAY_UNIQ=$(echo "$CLONE_RESP" | jq '.clones[-2].uniques // 0')
          else
            YESTERDAY=0; YESTERDAY_UNIQ=0
          fi
          if [ "$LEN" -ge 3 ]; then
            DAY_BEFORE=$(echo "$CLONE_RESP" | jq '.clones[-3].count // 0')
          else
            DAY_BEFORE=0
          fi

          # --- Views ---
          VIEW_RESP=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/views") || { echo "::warning::Traffic API (views) failed"; VIEW_RESP='{}'; }
          VIEW_COUNT=$(echo "$VIEW_RESP" | jq '.count // 0')
          VIEW_UNIQUES=$(echo "$VIEW_RESP" | jq '.uniques // 0')

          # --- Referrers ---
          REF_JSON=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/popular/referrers") || REF_JSON='[]'
          TOP_REF=$(echo "$REF_JSON" | jq -r '.[0] | "\(.referrer): \(.count) (\(.uniques) unique)" // "none"')

          # --- Top paths ---
          PATH_JSON=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/popular/paths") || PATH_JSON='[]'
          TOP_PATH=$(echo "$PATH_JSON" | jq -r '.[0] | "\(.path) — \(.count) views" // "none"')

          # --- CI attribution for the same day (issue #2378) ---
          # Clone stats include automated traffic and expose no source, but this
          # repo's clone series tracks Actions run volume (r=0.95, ~3.5 clones
          # per run over 14 days - docs/traffic-attribution.md). The runs API is
          # public, so read it without a token: total_count(created >= D) minus
          # total_count(created >= D+1) is the run count for day D. Every failure
          # below is non-fatal - the alert still files, just without the number.
          CI_RUNS=""
          CLONES_PER_RUN=""
          Y_TS=$(echo "$CLONE_RESP" | jq -r '.clones[-2].timestamp // empty' 2>/dev/null || true)
          if [ -n "$Y_TS" ]; then
            Y_DAY="${Y_TS%%T*}"
            NEXT_DAY=$(date -u -d "$Y_DAY +1 day" +%F 2>/dev/null || true)
            if [ -n "$NEXT_DAY" ]; then
              R0=$(curl -sf -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$OWNER/$REPO/actions/runs?per_page=1&created=%3E%3D${Y_DAY}T00:00:00Z" \
                | jq '.total_count // empty' 2>/dev/null || true)
              R1=$(curl -sf -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$OWNER/$REPO/actions/runs?per_page=1&created=%3E%3D${NEXT_DAY}T00:00:00Z" \
                | jq '.total_count // empty' 2>/dev/null || true)
              if [[ "$R0" =~ ^[0-9]+$ ]] && [[ "$R1" =~ ^[0-9]+$ ]] && (( R0 >= R1 )); then
                CI_RUNS=$(( R0 - R1 ))
                if (( CI_RUNS > 0 )); then
                  CLONES_PER_RUN=$(awk -v c="$YESTERDAY" -v r="$CI_RUNS" 'BEGIN { printf "%.1f", c / r }')
                fi
              fi
            fi
          fi

          # Trailing per-run baseline, over the same window the raw test uses
          # (every day except today and yesterday). One more runs call:
          # total_count(from that window's first day) minus R1 (from yesterday
          # on), reusing the R1 the attribution block above already fetched.
          AVG7=$(echo "$CLONE_RESP" | jq '[.clones[:-2][].count] | if length > 0 then (add / length | floor) else 0 end')
          TRAILING_CLONES=$(echo "$CLONE_RESP" | jq '[.clones[:-2][].count] | add // 0')
          TRAILING_RUNS=""
          TRAILING_CPR=""
          T0_TS=$(echo "$CLONE_RESP" | jq -r '.clones[0].timestamp // empty' 2>/dev/null || true)
          if [ -n "$T0_TS" ] && [[ "${R1:-}" =~ ^[0-9]+$ ]]; then
            T0_DAY="${T0_TS%%T*}"
            R_START=$(curl -sf -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$OWNER/$REPO/actions/runs?per_page=1&created=%3E%3D${T0_DAY}T00:00:00Z" \
              | jq '.total_count // empty' 2>/dev/null || true)
            if [[ "$R_START" =~ ^[0-9]+$ ]] && (( R_START > R1 )); then
              TRAILING_RUNS=$(( R_START - R1 ))
              TRAILING_CPR=$(awk -v c="$TRAILING_CLONES" -v r="$TRAILING_RUNS" 'BEGIN { printf "%.2f", c / r }')
            fi
          fi

          # --- SPIKE DECISION BEGIN ---
          # (replayed verbatim by tools/traffic-spike-decision-test.sh)
          # Baseline is ~2k clones/day from CI/bots, so judge spikes against
          # the trailing average (excluding today + yesterday) rather than a
          # fixed threshold that would fire a spike issue every day.
          # Everything inside this marked block is arithmetic on values already
          # computed above - no network - so the test replays it verbatim.
          SPIKE=false
          SPIKE_MSG=""
          SPIKE_ATTR=""
          RATIO=0
          if [ "${AVG7:-0}" -gt 0 ] 2>/dev/null && [ "$YESTERDAY" -gt 0 ]; then
            RATIO=$(awk -v y="$YESTERDAY" -v a="$AVG7" 'BEGIN { printf "%.1f", y/a }')
            if awk -v r="$RATIO" 'BEGIN { exit !(r >= 2.5) }'; then
              SPIKE=true
              SPIKE_MSG="SPIKE: ${YESTERDAY} clones yesterday vs ${AVG7} trailing avg (${RATIO}x)"
            fi
          elif [ "$YESTERDAY" -gt 0 ] && [ "$DAY_BEFORE" -gt 0 ]; then
            RATIO=$(( YESTERDAY / DAY_BEFORE ))
            if [ "$RATIO" -ge 3 ]; then
              SPIKE=true
              SPIKE_MSG="SPIKE: ${YESTERDAY} clones yesterday vs ${DAY_BEFORE} day before (${RATIO}x increase)"
            fi
          fi
          if [ "${YESTERDAY:-0}" -gt 5000 ] 2>/dev/null; then
            SPIKE=true
            SPIKE_MSG="${SPIKE_MSG} HIGH_VOLUME: ${YESTERDAY} clones in a single day"
          fi

          # CI attribution gate (issue #2420). CLONES_PER_RUN was computed for
          # the alert body but never consulted, so this test filed an issue on a
          # clone rise that *was* a run-count rise and then explained it away in
          # the same body: #2378 (3027 clones / 776 runs = 3.9 per run) and #2420
          # (3063 / 670 = 4.6) both sit inside the 2.1-5.0 clones/run band that
          # docs/traffic-attribution.md measured. Suppress only when the run data
          # is actually present AND the per-run rate is flat; with no run data
          # the old behaviour stands, and a >5000-clone day always files.
          if [ "$SPIKE" = "true" ] && [ -n "$CLONES_PER_RUN" ] && [ -n "$TRAILING_CPR" ] \
             && [ "${YESTERDAY:-0}" -le 5000 ] 2>/dev/null; then
            CPR_RATIO=$(awk -v y="$CLONES_PER_RUN" -v a="$TRAILING_CPR" 'BEGIN { printf "%.2f", (a > 0) ? y / a : 0 }')
            if awk -v r="$CPR_RATIO" -v m="${TRAFFIC_CPR_MIN:-1.5}" 'BEGIN { exit !(r < m) }'; then
              SPIKE=false
              SPIKE_MSG=""
              SPIKE_ATTR="raw clone ratio ${RATIO}x, but ${CLONES_PER_RUN} clones/run vs ${TRAILING_CPR} over ${TRAILING_RUNS} trailing runs (${CPR_RATIO}x) - attributed to CI run volume, not filing"
            fi
          fi
          # --- SPIKE DECISION END ---

          # --- Save outputs (use delimiter only when non-empty) ---
          {
            echo "CLONE_14D=$CLONE_COUNT"
            echo "CLONE_UNIQUES_14D=$CLONE_UNIQUES"
            echo "CLONE_YESTERDAY=$YESTERDAY"
            echo "CLONE_YESTERDAY_UNIQ=$YESTERDAY_UNIQ"
            echo "VIEW_14D=$VIEW_COUNT"
            echo "VIEW_UNIQUES_14D=$VIEW_UNIQUES"
            echo "TOP_REFERRER=$TOP_REF"
            echo "TOP_PATH=$TOP_PATH"
            echo "CI_RUNS_YESTERDAY=$CI_RUNS"
            echo "CLONES_PER_RUN=$CLONES_PER_RUN"
            echo "TRAILING_RUNS=$TRAILING_RUNS"
            echo "TRAILING_CPR=$TRAILING_CPR"
            echo "SPIKE=$SPIKE"
            EOF_MARKER="SPIKE_EOF_$(date +%s)_${RANDOM}"
            echo "SPIKE_MSG<<${EOF_MARKER}"
            echo "$SPIKE_MSG"
            echo "${EOF_MARKER}"
            EOF_MARKER2="SPIKE_ATTR_EOF_$(date +%s)_${RANDOM}"
            echo "SPIKE_ATTR<<${EOF_MARKER2}"
            echo "$SPIKE_ATTR"
            echo "${EOF_MARKER2}"
          } >> "$GITHUB_OUTPUT"

      - name: Report to Job Summary
        env:
          C: ${{ steps.traffic.outputs.CLONE_14D }}
          CU: ${{ steps.traffic.outputs.CLONE_UNIQUES_14D }}
          CY: ${{ steps.traffic.outputs.CLONE_YESTERDAY }}
          CYU: ${{ steps.traffic.outputs.CLONE_YESTERDAY_UNIQ }}
          V: ${{ steps.traffic.outputs.VIEW_14D }}
          VU: ${{ steps.traffic.outputs.VIEW_UNIQUES_14D }}
          REF: ${{ steps.traffic.outputs.TOP_REFERRER }}
          TOP_PATH: ${{ steps.traffic.outputs.TOP_PATH }}
          CIRUNS: ${{ steps.traffic.outputs.CI_RUNS_YESTERDAY }}
          CPR: ${{ steps.traffic.outputs.CLONES_PER_RUN }}
          TRUNS: ${{ steps.traffic.outputs.TRAILING_RUNS }}
          TCPR: ${{ steps.traffic.outputs.TRAILING_CPR }}
          SPIKE: ${{ steps.traffic.outputs.SPIKE }}
          SPIKE_MSG: ${{ steps.traffic.outputs.SPIKE_MSG }}
          SPIKE_ATTR: ${{ steps.traffic.outputs.SPIKE_ATTR }}
        run: |
          echo "## Traffic Report — ${GITHUB_REPOSITORY}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Clones (14d) | $C ($CU unique) |" >> $GITHUB_STEP_SUMMARY
          echo "| Yesterday | $CY clones ($CYU unique) |" >> $GITHUB_STEP_SUMMARY
          echo "| Views (14d) | $V ($VU unique) |" >> $GITHUB_STEP_SUMMARY
          echo "| Top referrer | $REF |" >> $GITHUB_STEP_SUMMARY
          echo "| Top path | $TOP_PATH |" >> $GITHUB_STEP_SUMMARY
          echo "| Spike detected | $SPIKE |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$CIRUNS" ]; then
            echo "| Workflow runs (same day) | $CIRUNS — $CPR clones/run |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$TRUNS" ]; then
            echo "| Trailing baseline | $TRUNS runs — $TCPR clones/run |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$SPIKE" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Alert: $SPIKE_MSG" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$SPIKE_ATTR" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Not filed (superseded by the CI-attribution gate): $SPIKE_ATTR" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create Spike Issue
        if: steps.traffic.outputs.SPIKE == 'true'
        env:
          # No checkout in this job, so gh can't detect the repo from git —
          # point it at the repository explicitly.
          GH_REPO: ${{ github.repository }}
          # Issue creation uses the built-in token (issues: write is enough).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CY: ${{ steps.traffic.outputs.CLONE_YESTERDAY }}
          CYU: ${{ steps.traffic.outputs.CLONE_YESTERDAY_UNIQ }}
          REF: ${{ steps.traffic.outputs.TOP_REFERRER }}
          TOP_PATH: ${{ steps.traffic.outputs.TOP_PATH }}
          CIRUNS: ${{ steps.traffic.outputs.CI_RUNS_YESTERDAY }}
          CPR: ${{ steps.traffic.outputs.CLONES_PER_RUN }}
        run: |
          # Ensure the label exists
          gh label create traffic-spike 2>/dev/null || true
          EXISTING=$(gh issue list --label traffic-spike --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Spike issue already open — skipping"
            exit 0
          fi
          {
            echo "## Traffic Spike Detected"
            echo ""
            echo "**Yesterday:** $CY clones ($CYU unique)"
            echo ""
            if [ -n "$CIRUNS" ]; then
              echo "- Workflow runs that day: **$CIRUNS** → **$CPR** clones per run"
            fi
            echo "- Top referrer (14d): ${REF:-none}"
            echo "- Top path (14d): ${TOP_PATH:-none}"
            echo ""
            echo "Clone figures include CI and bots, and this repo's series tracks"
            echo "Actions run volume (~3.5 clones/run, r=0.95). Compare the two"
            echo "numbers above before reading a spike as outside interest — see"
            echo "docs/traffic-attribution.md for the method and the baseline."
            echo ""
            echo "Report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/spike_body.md
          gh issue create \
            --title "Traffic spike: $CY clones ($CYU unique) yesterday" \
            --label traffic-spike \
            --body-file /tmp/spike_body.md
