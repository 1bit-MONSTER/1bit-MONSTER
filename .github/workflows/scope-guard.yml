name: Scope Guard

# Intent: engine + Jarvis offline assistant layer (engine + Jarvis = offline
# supreme for local AI + inference). Fail PRs that add code outside the
# product scope (inference backends, model loading, quantization, packaging,
# docs, CI, Jarvis layer) so bullshit features can't land via new top-level
# directories or unrelated additions.

# Scope Guard — this is the inference engine + Jarvis offline assistant layer.
# engine + Jarvis = offline supreme for local AI + inference. Fail PRs that add
# code outside the product scope so bullshit features can't land via new
# top-level directories or unrelated additions.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read
  pull-requests: write

jobs:
  scope_guard:
    name: Scope Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changed paths against engine scope
        env:
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Top-level paths that belong to the product: the inference engine
          # PLUS the Jarvis offline assistant layer (personas, skills, themes,
          # workers, integrations, zaya_audio are part of the offline package —
          # engine + Jarvis = offline supreme for local AI + inference).
          # Anything else (new dirs, unrelated apps/services) fails the PR.
          ALLOWED='
            AGENTS.md AUDIT_ISSUES.md CHANGELOG.md CLAUDE.md CMakeLists.txt
            CMakeLists_windows.txt CODE_OF_CONDUCT.md CONTRIBUTING.md LICENSE LICENSE-SHERRY.md
            Makefile.zamba2 PLAN-GAIA.md README.md ROADMAP.md SECURITY.md
            SHERRY-FILES.txt TODO_TRACKING.md VERSION env.sh install.sh
            package.json replace_i8ctx.py
            .github
            .pr_agent.toml
            engine kernels include src cmake adapters models rust
            ck-prefill spec-decode
            benchmarks Testing tests
            packaging snap
            docs site
            tools scripts bin
            mobile  # JARVIS mobile Flutter app (voice gateway client) — Jarvis offline layer, engine scope
            third_party  # vendored engine deps: Lemonade server core (embedded, engine scope)
            tools/video-lora  # C++ Vulkan inference backend (SD1.5/AnimateDiff) — engine scope, NOT an app
            experimental research hackathon fastflowlm_analysis npu-infer
            integrations themes
            npu_smoke.py  # pyxrt NPU engine smoke test (CI/bench harness on strix-halo runner) — engine scope
            .gitmodules .gitignore PLAN-GAIA.md third_party  # embedded Lemonade server core + vendored Gaia (zero-Python agent layer) — engine scope
            pixi.toml pixi.lock  # Mojo 1.0 toolchain pin (build tooling, like install.sh) — engine scope
            .rocm-stub  # ROCm stub headers/lib for build machines without a full ROCm install (whisper HIP port) — engine scope
            personas prompts skills workers zaya_audio  # burn-era deletions (UPDATE 34 cut) — removal-only, see docs/wiki/decisions.md
            .nojekyll CNAME apple-touch-icon.png assets favicon.ico favicon.svg
            index.html site.webmanifest  # 1bit.monster landing page, served via GitHub Pages from repo root — public-facing site scope
          '

          CHANGED="$(git diff --name-only "$BASE" "$HEAD" | sed 's#/.*##' | sort -u)"
          echo "Changed top-level paths:"
          echo "$CHANGED"

          VIOLATIONS=""
          for path in $CHANGED; do
            if ! echo "$ALLOWED" | grep -qw "$path"; then
              VIOLATIONS="$VIOLATIONS $path"
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Out-of-scope path(s):$VIOLATIONS"
            echo "::error::This repo is an inference engine. New top-level areas need an explicit scope discussion in the PR body before they can land."
            echo "::error::If this path IS engine-scope, add it to the ALLOWED list in .github/workflows/scope-guard.yml with justification in the PR."
            exit 1
          fi

          echo "✅ All changed paths are within engine scope."
