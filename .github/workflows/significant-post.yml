name: Significant post

# Scaffold a new blog entry for a SIGNIFICANT model-architecture arrival
# (major family, or a vision/multimodal variant of one) the way the Lemonade
# SDK loop publishes a post per release. Runs Testing/significant_model_post.py
# to produce a discoverable (SEO-tagged) DRAFT post, then opens a PR for a
# human/PR-agent pass. See that script for the `--arch`/`--model`/`--family`
# inputs.
#
# Auto-firing from the census is a follow-up: hf_new_models.py escalates
# SIGNIFICANT uncovered arrivals; this dispatches the post once the model is
# identified (manual now, wired to the escalation signal next).

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "stripped architecture class (e.g. deepseek_v4_flash)"
        required: true
      model:
        description: "example HF model id (e.g. deepseek-ai/DeepSeek-V4-Flash)"
        required: true
      family:
        description: "family name for the title (e.g. DeepSeek V4)"
        required: false
  schedule:
    - cron: "50 5 * * *"   # 05:50 UTC daily — regenerate any missed draft posts

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: significant-post
  cancel-in-progress: false

jobs:
  post:
    name: Generate significant-model blog post
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Scaffold the post
        id: gen
        run: |
          set -euo pipefail
          ARCH="${{ github.event.inputs.arch || 'deepseek_v4_flash' }}"
          MODEL="${{ github.event.inputs.model || 'deepseek-ai/DeepSeek-V4-Flash' }}"
          FAMILY="${{ github.event.inputs.family || '' }}"
          CMD=(python3 Testing/significant_model_post.py --arch "$ARCH" --model "$MODEL")
          [ -n "$FAMILY" ] && CMD+=(--family "$FAMILY")
          "${CMD[@]}"
          if git status --porcelain site/ Testing/significant_posts.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint GitHub App installation token
        if: steps.gen.outputs.changed == 'true'
        id: app-token
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          { [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; } || { echo "::error::APP_ID / APP_PRIVATE_KEY secrets not set — autopr cannot create PRs"; exit 1; }
          B64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          NOW=$(date +%s)
          HEADER=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | B64)
          PAYLOAD=$(printf '{"iat":%s,"exp":%s,"iss":%s}' "$((NOW-60))" "$((NOW+540))" "$APP_ID" | B64)
          SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -sign <(printf '%s' "$APP_PRIVATE_KEY") -binary | B64)
          JWT="$HEADER.$PAYLOAD.$SIG"
          AUTH="Authorization: Bearer $JWT"
          INSTALL_ID=$(curl -s -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations" | \
            jq -r --arg o "$GITHUB_REPOSITORY_OWNER" '.[] | select(.account.login == $o) | .id' | head -1)
          { [ -n "$INSTALL_ID" ]; } || { echo "::error::GitHub App not installed on $GITHUB_REPOSITORY_OWNER"; exit 1; }
          TOKEN=$(curl -s -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/$INSTALL_ID/access_tokens" | jq -r '.token // empty')
          { [ -n "$TOKEN" ]; } || { echo "::error::Could not mint installation token — check app permissions (Contents + Pull requests R/W)"; exit 1; }
          echo "TOKEN=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Open draft PR
        if: steps.gen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.TOKEN }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y%m%d)"
          BRANCH="post/significant-$DATE"
          if gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q .; then
            echo "PR for $BRANCH already open — nothing to do"; exit 0
          fi
          if git ls-remote --exit-code origin "$BRANCH" >/dev/null 2>&1; then git push origin --delete "$BRANCH"; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add site/ Testing/significant_posts.json
          git commit -m "post: significant model-architecture arrival ($DATE)"
          git push origin "$BRANCH"
          {
            echo "New blog entry for a significant model-architecture arrival. **Draft**: generated by"
            echo "significant_model_post.py — the body is a scaffold for a human/PR-agent pass (real"
            echo "architecture details + decode-validation status). SEO tags already present."
            echo; echo '```'; git status --porcelain site/ Testing/significant_posts.json; echo '```'
          } > /tmp/sig_pr_body.md
          gh pr create --base main --head "$BRANCH" --draft \
            --title "post: significant model arrival $DATE" \
            --body-file /tmp/sig_pr_body.md
