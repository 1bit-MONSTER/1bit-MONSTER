name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1'  # weekly on Monday at 2:30 UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['c-cpp', 'javascript-typescript', 'actions']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Build C++ for CodeQL
      if: matrix.language == 'c-cpp'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq g++ cmake 2>/dev/null || true
        # Try TheRock — full build if available
        python3 -m pip install --index-url https://rocm.nightlies.amd.com/v2/gfx1151/ \
          rocm[devel,libraries] 2>/dev/null && echo "TheRock installed" || {
          echo "ROCm not available — compiling individual C++ sources for CodeQL tracing"
          # Compile a representative subset so CodeQL can trace + build a database
          find src/ -maxdepth 1 -name '*.cpp' | while read -r f; do
            echo "Tracing: $f"
            g++ -std=c++23 -c -fsyntax-only -I src -I include "$f" 2>&1 | tail -2 || true
          done
          # Also trace test files
          find tests/ -maxdepth 1 -name '*.cpp' | while read -r f; do
            echo "Tracing: $f"
            g++ -std=c++23 -c -fsyntax-only -I src -I include "$f" 2>&1 | tail -2 || true
          done
          exit 0
        }
        # TheRock available — full build
        cmake -B build -G Ninja -DCMAKE_HIP_ARCHITECTURES=gfx1151
        ninja -C build -j$(nproc) 2>&1 || true

    - name: Autobuild (JavaScript/TypeScript/Actions)
      if: matrix.language != 'c-cpp'
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
