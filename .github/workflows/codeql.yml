name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1'  # weekly on Monday at 2:30 UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['c-cpp', 'javascript-typescript', 'actions']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Build C++ for CodeQL
      if: matrix.language == 'c-cpp'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq g++ cmake ninja-build 2>/dev/null || true
        # Try TheRock — full build if available
        if python3 -m pip install --index-url https://rocm.nightlies.amd.com/v2/gfx1151/ \
          rocm[devel,libraries] 2>/dev/null; then
          echo "TheRock installed — discovering SDK path"
          # Find the pip-installed SDK and export THEROCK_PIP_ROOT so CMake can find amdclang++
          SDK_PATH=$(python3 -c "
import site, glob, os
for d in site.getsitepackages():
    p = os.path.join(d, '_rocm_sdk_devel')
    if os.path.isdir(p):
        print(p)
        break
" 2>/dev/null || true)
          if [ -z "$SDK_PATH" ]; then
            SDK_PATH=$(find ~/.local/lib -name '_rocm_sdk_devel' -type d 2>/dev/null | head -1)
          fi
          echo "SDK_PATH=$SDK_PATH"
          if [ -n "$SDK_PATH" ] && [ -f "$SDK_PATH/bin/amdclang++" ]; then
            export THEROCK_PIP_ROOT="$SDK_PATH"
            echo "THEROCK_PIP_ROOT=$THEROCK_PIP_ROOT"
            cmake -B build -G Ninja -DCMAKE_HIP_ARCHITECTURES=gfx1151
            ninja -C build -j$(nproc) 2>&1 || true
          else
            echo "amdclang++ not found in SDK path — tracing individual files instead"
            find src/ -maxdepth 1 -name '*.cpp' | while read -r f; do
              g++ -std=c++23 -c -fsyntax-only -I src -I include "$f" 2>&1 | tail -2 || true
            done
            find tests/ -maxdepth 1 -name '*.cpp' | while read -r f; do
              g++ -std=c++23 -c -fsyntax-only -I src -I include "$f" 2>&1 | tail -2 || true
            done
          fi
        else
          echo "TheRock pip install failed — compiling individual C++ sources for CodeQL tracing"
          find src/ -maxdepth 1 -name '*.cpp' | while read -r f; do
            g++ -std=c++23 -c -fsyntax-only -I src -I include "$f" 2>&1 | tail -2 || true
          done
          find tests/ -maxdepth 1 -name '*.cpp' | while read -r f; do
            g++ -std=c++23 -c -fsyntax-only -I src -I include "$f" 2>&1 | tail -2 || true
          done
        fi

    - name: Autobuild (JavaScript/TypeScript/Actions)
      if: matrix.language != 'c-cpp'
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
