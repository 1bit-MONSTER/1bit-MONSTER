name: TMP RUM Diag

on:
  pull_request:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == '1bit-MONSTER/1bit-MONSTER'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: RUM + zone diagnostic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WA_TOKEN: ${{ secrets.CLOUDFLARE_WA_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          WA="${CLOUDFLARE_WA_TOKEN:-$CLOUDFLARE_API_TOKEN}"
          gql() {
            curl -s -X POST "https://api.cloudflare.com/client/v4/graphql" \
              -H "Authorization: Bearer $WA" -H "Content-Type: application/json" \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$1")"
          }
          echo "ACCT_ID_len=${#CLOUDFLARE_ACCOUNT_ID} acct_prefix=${CLOUDFLARE_ACCOUNT_ID:0:8}"

          echo "== A. accounts visible to the WA token =="
          curl -s -H "Authorization: Bearer $WA" "https://api.cloudflare.com/client/v4/accounts?per_page=50" | \
            jq -r 'if .success then (.result[]? | "\(.id)  \(.name)") else "ERR \(.errors)" end'

          echo "== B. zones visible (looking for 1bit.monster) =="
          curl -s -H "Authorization: Bearer $WA" "https://api.cloudflare.com/client/v4/zones?per_page=50" | \
            jq -r 'if .success then (.result[]? | "\(.id)  \(.name)") else "ERR \(.errors)" end'

          echo "== C. RUM scan: account from secret, with siteTag 33fb8448... =="
          gql "{ viewer { accounts(filter: {accountTag: \"$CLOUDFLARE_ACCOUNT_ID\"}) { rumPageloadEventsAdaptiveGroups(limit: 10, filter: {siteTag: \"33fb8448bfe84a56b1b06bbfea9f2032\", date_geq: \"2026-08-24\", date_leq: \"2026-08-26\"}, orderBy: [sum_visits_DESC]) { dimensions { requestPath date } sum { visits } } } } }" | jq .

          echo "== D. RUM scan: account from secret, NO siteTag (any site data?) =="
          gql "{ viewer { accounts(filter: {accountTag: \"$CLOUDFLARE_ACCOUNT_ID\"}) { rumPageloadEventsAdaptiveGroups(limit: 10, filter: {date_geq: \"2026-08-24\", date_leq: \"2026-08-26\"}, orderBy: [sum_visits_DESC]) { dimensions { siteTag requestPath } sum { visits } } } } }" | jq .

          echo "== E. RUM scan: datetime filter variant (secret account) =="
          gql "{ viewer { accounts(filter: {accountTag: \"$CLOUDFLARE_ACCOUNT_ID\"}) { rumPageloadEventsAdaptiveGroups(limit: 10, filter: {siteTag: \"33fb8448bfe84a56b1b06bbfea9f2032\", datetimeMinute_geq: \"2026-08-25T00:00:00Z\", datetimeMinute_leq: \"2026-08-26T23:59:59Z\"}, orderBy: [sum_visits_DESC]) { dimensions { requestPath } sum { visits } } } } }" | jq .

          echo "== F. zone analytics for each zone found in B =="
          for Z in $(curl -s -H "Authorization: Bearer $WA" "https://api.cloudflare.com/client/v4/zones?per_page=50" | jq -r '.result[]?.id'); do
            ZN=$(curl -s -H "Authorization: Bearer $WA" "https://api.cloudflare.com/client/v4/zones/$Z" | jq -r '.result.name')
            echo "-- zone $ZN ($Z) --"
            gql "{ viewer { zones(filter: {zoneTag: \"$Z\"}) { httpRequests1dGroups(limit: 10, filter: {date_geq: \"2026-08-19\", date_leq: \"2026-08-26\"}, orderBy: [date_ASC]) { dimensions { date } sum { requests pageViews uniques } } } } }" | jq -c '.data.viewer.zones[0].httpRequests1dGroups // .errors'
          done
