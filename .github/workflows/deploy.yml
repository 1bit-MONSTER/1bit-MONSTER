name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/gen_docs_site.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install markdown-it-py
        run: pip install markdown-it-py

      - name: Lint docs Markdown (parse-check — issue #1963)
        run: python3 scripts/lint_docs_markdown.py

      - name: Stage site + generated docs (single surface at /docs/)
        run: |
          mkdir -p _deploy
          cp -a site/. _deploy/
          python3 scripts/gen_docs_site.py --out _deploy/docs

      - name: Set the gh-auth function secrets on the Pages project
        # The function needs the App credentials as *Pages project* env, not as
        # repo files. Values come from Actions secrets and are never printed.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          AUTH_TOKEN: ${{ secrets.GH_AUTH_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          for v in APP_ID APP_PRIVATE_KEY AUTH_TOKEN; do
            eval "val=\$$v"
            [ -n "$val" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repo secrets:$missing"; exit 1
          fi
          for key in APP_ID APP_PRIVATE_KEY AUTH_TOKEN; do
            eval "val=\$$key"
            printf '%s' "$val" | npx --yes wrangler@4 pages secret put "$key" --project-name=1bit-monster
          done
          echo "gh-auth secrets set on Pages project 1bit-monster (values not printed)"

      - name: Stage the Pages Function at the project root
        # Cloudflare compiles Pages Functions from `functions/` at the project
        # root, not from inside the uploaded directory -- and this repo's Scope
        # Guard keeps the set of committed top-level paths fixed, which is a gate
        # the operator owns, not something a feature PR should edit. So the handler
        # is committed under site/ (in scope) and materialised here for the deploy.
        run: |
          set -euo pipefail
          mkdir -p functions
          cp site/functions/gh-auth.js functions/gh-auth.js
          ls -l functions/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _deploy --project-name=1bit-monster

  deploy-github-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install markdown-it-py
        run: pip install markdown-it-py

      - name: Lint docs Markdown (parse-check — issue #1963)
        run: python3 scripts/lint_docs_markdown.py

      - name: Stage site + generated docs (single surface at /docs/)
        run: |
          mkdir -p _deploy
          cp -a site/. _deploy/
          python3 scripts/gen_docs_site.py --out _deploy/docs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _deploy
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
