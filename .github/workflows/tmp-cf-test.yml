name: tmp-cf-test
on: [push, pull_request]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Delete domain+project, recreate with new source
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          P="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/eeg-medical"
          echo "--- DEL DOMAIN ---"
          curl -s -X DELETE -H "Authorization: Bearer $CF_TOKEN" "$P/domains/eeg-medical.1bit.systems" | python3 -c "import json,sys; d=json.load(sys.stdin); print('del domain success:', d.get('success'), json.dumps(d.get('errors'))[:150])"
          echo "--- DEL PROJECT ---"
          curl -s -X DELETE -H "Authorization: Bearer $CF_TOKEN" "$P" | python3 -c "import json,sys; d=json.load(sys.stdin); print('del project success:', d.get('success'), json.dumps(d.get('errors'))[:150])"
          echo "--- CREATE ---"
          curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d '{"name": "eeg-medical", "production_branch": "main", "build_config": {"build_command": "", "destination_dir": "site/eeg-medical", "root_dir": ""}, "source": {"type": "github", "config": {"owner": "1bit-systems", "repo_name": "eeg-medical", "production_branch": "main"}}}' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result',{}); print('create success:', d.get('success'), json.dumps(d.get('errors'))[:300]); s=r.get('source',{}); print('source:', s.get('config',{}).get('owner'), s.get('config',{}).get('repo_name')); print('subdomain:', r.get('subdomain'))"
          echo "--- ADD DOMAIN ---"
          curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d '{"name": "eeg-medical.1bit.systems"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/eeg-medical/domains" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result',{}); print('add domain success:', d.get('success'), json.dumps(d.get('errors'))[:200]); print('domain:', r.get('name'), r.get('status'))"
