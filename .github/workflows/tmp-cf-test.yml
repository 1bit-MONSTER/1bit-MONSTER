name: tmp-cf-test
on: [push, pull_request]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Try full PATCH with source
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name": "eeg-medical", "production_branch": "main", "build_config": {"build_command": "", "destination_dir": "site/eeg-medical", "root_dir": ""}, "source": {"type": "github", "config": {"owner": "1bit-systems", "repo_name": "eeg-medical", "production_branch": "main"}}}' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/eeg-medical" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result',{}); print('success:', d.get('success')); print('errors:', json.dumps(d.get('errors'))[:300]); s=r.get('source',{}); print('source now:', s.get('config',{}).get('owner'), s.get('config',{}).get('repo_name'))"
