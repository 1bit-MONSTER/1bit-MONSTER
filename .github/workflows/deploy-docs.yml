name: Deploy Docs Site

# Deploys the docs.1bit.monster documentation site to Cloudflare Pages.
#
# The site is generated from the repo's curated `docs/` Markdown by
# `scripts/gen_docs_site.py` and deployed to a *separate* Cloudflare Pages
# project (`1bit-monster-docs`) so it can live on the `docs.1bit.monster`
# subdomain independently of the main `1bit.monster` marketing site.
#
# ── One-time Cloudflare setup (done by the repo owner, not this workflow) ──
#   1. Create the Pages project named `1bit-monster-docs`
#      (either in the dashboard or via the Pages API; deploy below will also
#       auto-create it if it does not exist yet).
#   2. Add a custom domain `docs.1bit.monster` to that project and point the
#      `docs` CNAME at the Cloudflare Pages hostname. Both Cloudflare API token
#      (`CLOUDFLARE_API_TOKEN`) and account id (`CLOUDFLARE_ACCOUNT_ID`) are
#      GitHub Actions secrets already used by `deploy.yml`.
#
# The `docs` CNAME must be a record in the `1bit.monster` DNS zone.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/gen_docs_site.py'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@39cd14987082fddc554f5c9d559f31e2a45d2b8d  # v5.2.0
        with:
          python-version: '3.11'

      - name: Install markdown-it-py
        run: pip install markdown-it-py

      - name: Generate docs site
        run: python3 scripts/gen_docs_site.py --out docs-site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs-site --project-name=1bit-monster-docs
