name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ (cmake configure + build)
    runs-on: ubuntu-24.04
    # TheRock nightly SDK install (~6 GB) + full engine build routinely runs
    # 21-25 min uncached; the merge queue re-runs it fresh, so 25 min was
    # timing out and cancelling every merge-group CI. Raised to 45.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build build-essential python3 python3-venv ccache \
            libcurl4-openssl-dev libzstd-dev libwebsockets-dev \
            libvulkan-dev glslc uuid-dev libdrm-dev spirv-headers  # zinc_cpp (Vulkan) + lockfile (-luuid) + lemonade amdxdna (libdrm) + llama.cpp ggml-vulkan (SPIRV)
          # XRT (Xilinx Runtime) — backend_fused.cpp/backend_fused_npu.cpp need
          # xrt headers at compile time (same dep release.yml installs).
          sudo apt-get install -y -qq libxrt-dev || \
            echo "::warning::libxrt-dev not available — fused NPU backends stubbed"
      - name: Compute ROCm cache key (weekly — TheRock is a nightly index)
        id: rocm-week
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache TheRock ROCm SDK
        id: cache-rocm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /opt/rocm-therock
          key: rocm-therock-${{ runner.os }}-${{ steps.rocm-week.outputs.week }}
      # ccache for the two build steps below. Measured on run 35292288821: this job is
      # 15.8 min, of which "Build llama.cpp ggml-vulkan libs" is 3.9 and "CMake configure
      # + build" is 9.2. Every other step is under a minute, and the TheRock cache above
      # already HITS (0.5 min restore, 0.0 min install), so the remaining cost is
      # compilation - re-done from scratch for every speculative merge-queue build. The
      # key is per-run with a restore-key so the newest cache wins; caches written on the
      # default branch are visible to the queue's ephemeral refs, the same mechanism the
      # TheRock cache already relies on.
      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Configure ccache
        run: |
          # 1 GB keeps this inside the repo's cache budget beside TheRock. The hit rate
          # is printed at the end of each build, so a cache that stops helping shows up
          # in the log instead of being assumed.
          ccache --max-size=1G
          ccache --zero-stats
          ccache --version | head -1
          # Persist for the build steps: compressed entries are what keep this inside
          # the repo's 10 GB cache budget beside TheRock.
          echo "CCACHE_COMPRESS=1" >> "$GITHUB_ENV"

      - name: Install TheRock ROCm (nightly, native gfx1151)
        if: steps.cache-rocm.outputs.cache-hit != 'true'
        run: |
          # TheRock nightly ROCm only (native gfx1151). This repo never falls
          # back to apt ROCm 7.2.4 — if TheRock can't install, CI fails.
          sudo python3 -m venv /opt/rocm-therock
          sudo /opt/rocm-therock/bin/pip install \
            "rocm[devel,libraries]" \
            --index-url https://rocm.nightlies.amd.com/whl-multi-arch/
          sudo /opt/rocm-therock/bin/rocm-sdk init
      - name: Build llama.cpp ggml-vulkan libs
        run: |
          # backend_ggml_vulkan.cpp (in unified_server + onebin) compiles the
          # real wrapper when llama.h is reachable — the submodule is checked
          # out on CI — and links libllama/libggml-vulkan. Build them first.
          cd third_party/llama.cpp
          # llama-onnx.cpp includes onnxruntime_cxx_api.h unconditionally at
          # this pin; no onnxruntime package exists for ubuntu-24.04 runners.
          # The engine doesn't use llama's ONNX path — drop the TU.
          sed -i '/llama-onnx\.cpp/d' src/CMakeLists.txt
          cmake -B build -G Ninja -DBUILD_SHARED_LIBS=OFF -DGGML_VULKAN=ON \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j8 --target ggml-vulkan llama llama-common
          ls -la build/ggml/src/ggml-vulkan/libggml-vulkan.a build/src/libllama.a
          ccache --show-stats | sed -n '1,12p' || echo "(ccache stats unavailable)"
      - name: Verify CMakeLists references resolve
        run: |
          set -e
          python3 -<<'PY'
          import re, pathlib, sys
          root = pathlib.Path('.')
          missing = []
          txt = root.joinpath('CMakeLists.txt').read_text()
          for m in re.findall(r'add_subdirectory\(\s*([^\s\)\s]+)', txt):
              if not (root / m / 'CMakeLists.txt').exists():
                  missing.append(f'add_subdirectory({m}) -> missing CMakeLists.txt')
          for m in re.findall(r'(?:add_executable|add_library)\((.*?)\)', txt, re.S):
              for tok in re.findall(r'([A-Za-z0-9_/+.-]+\.(?:cpp|cc|hip|mm|rc))', m):
                  if not (root / tok).exists():
                      missing.append(f'source file missing: {tok}')
          if missing:
              print('CMakeLists references unresolved files/dirs:')
              for x in missing: print(' -', x)
              sys.exit(1)
          print('All CMakeLists source/subdirectory references resolve.')
          PY
      # ── Registry source checks (informational) ────────────────────────────────
      # Two checks that need NO build, NO deps and NO AMD hardware, so they run on a
      # stock runner in milliseconds:
      #   dispatch_key_check.sh — "a type is a dispatch key iff the ids under it do not
      #     all share one `available` expression" (written by @agent-ec855d). It fails
      #     when the RECORDED four-type set CHANGES, which is the forward-looking
      #     property a comment cannot have. It cannot say a type is wrong, only that the
      #     set moved — so it is informational on purpose: legitimate growth must ride a
      #     deliberate commit, and a required check would have the first person it
      #     blocks delete it rather than update KNOWN_DISPATCH.
      #   registry_flag_audit.py --static-only — usage parity + cross-TU references.
      #     The behavioural half needs a built binary and is deliberately not here.
      # Promoted to required only once the four-type set stops moving.
      - name: Registry source checks (informational)
        continue-on-error: true
        run: |
          # `|| true` on EACH line, deliberately: under the default `bash -e` the
          # first failure aborts the block, so a dispatch-key report (exit 1) would
          # hide the flag audit's output entirely. Both are informational, so both
          # diagnostics should always appear. (Found by @agent-ec855d.)
          sh tools/dispatch_key_check.sh src/backend_manager.cpp || true
          python3 tools/registry_flag_audit.py --static-only || true

      # ── Registry behavioural audit (informational) ────────────────────────────
      # The half of the flag audit that needs a BINARY. CI-feasible for a specific
      # reason worth stating: `registry_scan` compiles standalone with plain clang++
      # and no HIP/XRT — the property that makes the registry module
      # engine-independent is also what makes this runnable on a stock runner, and no
      # engine build is involved. The fixture is a VERSIONED tool
      # (tools/registry_fixture.py) rather than an inline heredoc, so CI and local runs
      # use the same bytes and a CI-only failure is real.
      - name: Registry behavioural audit (informational)
        continue-on-error: true
        run: |
          # ANY C++23 compiler, not `clang++` specifically — two reasons, both learned today
          # and one of them from this line's sibling in the runbook:
          #   * a runner clang older than 16 rejects `-std=c++23` outright;
          #   * the development box has NO clang++ at all and builds it with g++ (found by
          #     @agent-ec855d). The runbook's recipe was fixed for that hours earlier and the
          #     fix was never propagated here — the sibling pattern, in my own config.
          CXX=$(command -v clang++ || command -v g++)
          echo "registry_scan: using $CXX"
          # NOT `|| true`. The rest of this step is meaningless without the binary, so a
          # swallowed compile failure would report a GREEN step that did nothing — the exact
          # failure this work exists to catch, inside the check written to catch it.
          "$CXX" -std=c++23 -O2 -Iinclude -DREGISTRY_SCAN_STANDALONE \
            tools/registry_scan.cpp src/model_registry.cpp -o /tmp/registry_scan
          python3 tools/registry_fixture.py /tmp/registry-ci-fixture || true
          python3 tools/registry_flag_audit.py --binary /tmp/registry_scan \
            --fixture /tmp/registry-ci-fixture || true
      - name: CMake configure + build (reference checks only when no ROCm)
        run: |
          if [ -x /opt/rocm-therock/bin/amdclang++ ]; then
            echo "TheRock detected — full cmake configure + build."
            cmake -B build -G Ninja -DCMAKE_HIP_ARCHITECTURES=gfx1151 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_HIP_COMPILER_LAUNCHER=ccache
            # Build the server AND every test_* target so a dropped source or a
            # compile break fails CI (issue #236).
            # Also build all new C++ tools to catch compile errors.
            # zaya_server/onebitd/onebit/unified_router/vision_server are no
            # longer separate targets — their sources compile into onebin/1bit
            # only (see CMakeLists.txt). Build onebin instead of listing them.
            ninja -C build onebin \
              test_medusa_skeleton test_standalone_nock test_prim_and_attn \
              test_ternary_gemm_smallm test_sherry_gemv test_bonsai_gemv \
              test_zaya_moe_gemv test_cca_attn test_wmma_i8_gemv \
              test_bonsai_e2e test_sherry_e2e test_block_scaled_ternary \
              test_gguf_reader_dequant test_tokenizer_logprobs test_backend \
              test_lora_runtime test_npu_flm_delta test_moe_fused_math \
              ppl_generic gguf_to_onebp vl_logit_check \
              vl_pipeline_test test_vit_encoder zaya1_vl_demo
          else
            echo "ROCm not available on this runner — reference checks only."
            if [ -f tests/test_medusa_skeleton.cpp ]; then
              echo "test_medusa_skeleton.cpp exists — monorepo wiring OK."
            else
              echo "Missing test_medusa_skeleton.cpp — build wiring broken."
              exit 1
            fi
          fi
          # Printed on both paths: the hit rate is the evidence that this cache does
          # something, and it is the number this change is judged on.
          ccache --show-stats | sed -n '1,12p' || echo "(ccache stats unavailable)"
      - name: CLI entry points reachable (built binary)
        run: |
          # The static list checks live in Testing/dispatch_selfcheck.py, in the
          # host-only suite. They cannot see whether the LINKED binary routes
          # those names — which is how `./run.sh chat` shipped printing the usage
          # text while every static check passed. This runs the artifact: every
          # subcommand tools/onebin.cpp dispatches and every symlink
          # packaging/Makefile installs, probed with --help. It skips itself when
          # the build produced no binary (the no-ROCm runner path).
          python3 Testing/cli_smoke.py
      - name: Run headless tests (ctest -L host)
        run: |
          if [ -d build ]; then
            # test_medusa_skeleton links rocm_cpp (shared) → needs HIP libs at
            # runtime; the loader can't find them without TheRock on the path.
            PYTHON_SITE="$(dirname "$(find /opt/rocm-therock/lib -name '_rocm_sdk_devel' -type d 2>/dev/null | head -1)")"
            if [ -n "$PYTHON_SITE" ]; then
              export LD_LIBRARY_PATH="$PYTHON_SITE/_rocm_sdk_devel/lib:$PYTHON_SITE/_rocm_sdk_core/lib:$PYTHON_SITE/_rocm_sdk_libraries/lib:${LD_LIBRARY_PATH:-}"
            fi
            ctest --test-dir build -L host --output-on-failure
          else
            echo "No build/ directory (ROCm unavailable on this runner) - skipping host ctest."
          fi
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: warning
          # Vendored trees ONLY: deps pulled in by the cmake build (mbedtls,
          # cpp_httplib) ship shell scripts that fail SC warnings — never our code.
          # `packaging` was listed here as though it were vendored, but all 13 shell
          # scripts under it are first-party, and the exclusion was hiding a real
          # SC2155 in packaging/model-download.sh (fixed in the same change). Lifting
          # it costs nothing: at severity=warning the whole first-party tree is clean
          # — 147 scripts scanned, 0 findings.
          ignore_paths: 'build _deps third_party'

  lint:
    name: Lint (clang-format)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The `| head -20` below discarded the xargs status (the default shell here is
      # `bash -e {0}`, without pipefail, so a pipeline reports head's status), which
      # meant this step could never fail regardless of its label — a latent trap for
      # whoever promotes it by deleting "(informational)". `continue-on-error` makes
      # the intent EXPLICIT, and the status is now captured rather than discarded, so
      # removing the label really is the only thing that would make it blocking.
      # (Trap described by @agent-ec855d; masking fixed under #2486.)
      - name: clang-format check (informational)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq clang-format
          # Cap the OUTPUT, keep the STATUS. `... | head -20` alone is not enough:
          # without pipefail the pipeline reports the cap's success, so a real
          # formatting failure would read as a green step. Assigned in a command
          # substitution with `|| rc=$?` so `set -e` does not abort before the cap.
          rc=0
          # Scope: the exclusions the sibling lint job now declares
          # (`ignore_paths: build _deps third_party`). Without them this step lints
          # third_party/, which is 62,694 of the 236,340 diagnostics on this tree -
          # 27% of the output it asks a reader to interpret.
          # `packaging/` is deliberately NOT excluded: #2491 established it is
          # first-party (packaging/binary/server.cpp), not vendored, and removed it
          # from the other job for exactly that reason.
          # -print0/-0: a path containing a space used to split into two arguments.
          find . \( -name '*.cpp' -o -name '*.h' -o -name '*.hip' -o -name '*.hpp' \) -print0 \
            | grep -zvE '/(build|_deps|third_party|\.git)/' > /tmp/clang-format.files
          considered=$(tr -cd '\0' < /tmp/clang-format.files | wc -c)
          out=$(xargs -0 clang-format --dry-run --Werror < /tmp/clang-format.files 2>&1) || rc=$?
          printf '%s\n' "$out" | head -20
          # A count, so this informational step is worth reading: #2486's decision is
          # between gating the diff and reformatting the tree, and the size of the
          # second is this number.
          diags=$(printf '%s\n' "$out" | grep -cE '^[^:]+:[0-9]+:[0-9]+: (warning|error):' || true)
          files=$(printf '%s\n' "$out" | grep -oE '^[^:]+:[0-9]+:[0-9]+:' | cut -d: -f1 | sort -u | wc -l)
          echo "clang-format: $diags diagnostic(s) in $files of $considered file(s) - $(clang-format --version)"
          echo "::notice::clang-format: $diags diagnostics in $files of $considered files (informational; see #2486)"
          exit "$rc"

  version:
    name: Version consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: All manifests match root VERSION
        run: bash scripts/sync-version.sh --check
      # The job name stays "Version consistency" on purpose: required checks are referenced by
      # NAME in the ruleset, so renaming the job to describe this step would silently detach the
      # gate -- the same class of failure this step exists to catch.
      - name: Tracked shell scripts are executable
        run: |
          # A script committed 100644 cannot be run by path: execve fails and the caller reports
          # exit 126, which reads as "the check failed" rather than "the check never ran". That is
          # exactly how the kernel-object lint job went red (#2216): the script was 100644 while the
          # workflow invoked it by path, and the failing step was the check itself.
          bad=$(git ls-files -s -- '*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$bad" ]; then
            echo "::error::tracked shell scripts that are not mode 100755:"
            echo "$bad" | sed 's/^/  /'
            echo "fix: git ls-files -s -- '*.sh' | awk '\$1 != \"100755\" {print \$4}' | xargs -r git update-index --chmod=+x"
            exit 1
          fi
          echo "OK: $(git ls-files -s -- '*.sh' | wc -l) tracked .sh files, all mode 100755"

      - name: Required check names still exist
        # A required check is matched by NAME in ruleset 19117606. Renaming one of these
        # jobs detaches the gate silently: the ruleset waits for a context that never
        # reports, and a PR merges with that gate absent rather than failing. The job name
        # above is kept as "Version consistency" for exactly this reason, and this step is
        # what notices when someone renames one of the others.
        #
        # Stated blind spot, so it is not mistaken for coverage: if THIS job were renamed,
        # the check that would catch it would not run either. The other three are covered.
        run: |
          set -euo pipefail
          required=(
            "C++ (cmake configure + build)"
            "Lint (clang-format)"
            "Scope Guard"
            "Version consistency"
          )
          # `|| true`: a glob that matches nothing must reach the guard below, which names
          # the cause. Letting grep fail here would exit non-zero for an unnamed reason —
          # still loud, but it would read as a broken check rather than an empty corpus.
          names=$( { grep -rhoE '^\s{4}name:\s*.+$' .github/workflows/*.yml 2>/dev/null || true; } \
                  | sed 's/^\s*name:\s*//' | sed 's/[[:space:]]*$//' | sort -u)
          if [ -z "$names" ]; then
            echo "::error::no job names parsed from .github/workflows — this check would be vacuous"
            exit 1
          fi
          missing=""
          for r in "${required[@]}"; do
            printf '%s\n' "$names" | grep -Fxq "$r" || missing="$missing
            $r"
          done
          if [ -n "$missing" ]; then
            echo "::error::required check name(s) from ruleset 19117606 that no workflow job declares:$missing"
            echo "::error::a renamed job detaches its required gate silently. Keep the name, or update the ruleset in the same change."
            exit 1
          fi
          echo "required check names present: ${#required[@]} of $(printf '%s\n' "$names" | grep -c .) job names in $(ls .github/workflows/*.yml | wc -l) workflows"

  metal:
    name: Metal backend (macOS build + smoke gate)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build backend_metal (compile + link gate)
        run: |
          # backend_metal.mm has never been compiled in CI — this is the real
          # gate: catches ObjC/ARC/Metal-framework errors. Builds the backend
          # object + a smoke harness that instantiates it and generates tokens.
          clang++ -std=c++17 -fobjc-arc -Iinclude -Isrc -c src/backend_metal.mm -o /tmp/backend_metal.o
          clang++ -std=c++17 -fobjc-arc -Iinclude -Isrc Testing/metal_smoke.mm src/backend_metal.mm \
            -framework Metal -framework MetalPerformanceShaders \
            -framework MetalPerformanceShadersGraph -o /tmp/metal_smoke
      - name: Run Metal smoke gate (synthetic model, real GPU)
        run: |
          mkdir -p /tmp/metal-w
          /tmp/metal_smoke /tmp/metal-w 8

  smoke-test:
    name: Inference smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check download_and_run.sh exists
        run: |
          if [ -f tests/download_and_run.sh ]; then
            echo "✅ tests/download_and_run.sh exists"
            bash -n tests/download_and_run.sh && echo "  Shell syntax OK"
          else
            echo "⚠️  tests/download_and_run.sh not yet written for non-HW runners"
          fi

  # Host-only self-checks (Testing/run_all.sh): plain g++, no ROCm, no NPU, no
  # model fixtures — so they run on any runner. Nothing was running them, and
  # Testing/router_selfcheck.cpp had been failing on main since the HRX-first
  # routing landed (2026-08-29) without anyone noticing. Same shape as ppl-gate:
  # a cheap CPU-only gate that catches a class of regression nothing else does.
  self-checks:
    name: Self-checks (Testing/run_all.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run the self-check suite
        run: bash Testing/run_all.sh

  # PPL format gate (issue #1242): the 30-second quality gate that caught the
  # TQ2 catastrophe (ppl 3.7e8 vs Q4NX 62 vs fp16 21.8). Rebuilds the converter
  # + harness with plain g++ (CPU-only, no ROCm needed), converts a fresh Q8_0
  # GGUF to Q4NX 1BP, and asserts the perplexity window on the fixed 48-sample
  # gate set. Measured locally: Q4NX-from-Q8_0 ppl 16.34; TQ2-of-dense 1.1e8.
  # A TQ2-class regression (or a corrupt converter/reader) blows the window.
  ppl-gate:
    name: PPL format gate (Q8_0 → Q4NX 1BP)
    runs-on: ubuntu-24.04
    # Passes in ~2-6 min on PR checks but hits 20 min on the contended
    # merge-queue runner pool; raised to 30 for headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake
      - name: Build ppl_generic (baseline x86-64 flags — packed path is target-attributed)
        run: |
          mkdir -p build
          g++ -O3 -std=c++23 -fopenmp -I src -I include -I engine/npu/src \
            research/ws00-baseline/ppl_generic.cpp \
            src/model_discovery.cpp src/gguf_reader.cpp \
            src/q4nx_reader.cpp src/safetensors_reader.cpp \
            -o build/ppl_generic
      - name: Build gguf_to_onebp
        run: |
          g++ -O3 -std=c++23 -I src -I include -I engine/npu/src \
            src/gguf_to_onebp.cpp src/gguf_reader.cpp -o build/gguf_to_onebp
      - name: Download Qwen3-0.6B Q8_0 GGUF (converter source)
        run: |
          curl -fL --retry 3 -o qwen3-0.6b-q8_0.gguf \
            https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf
          ls -la qwen3-0.6b-q8_0.gguf
      - name: Convert Q8_0 → Q4NX 1BP
        run: |
          # Explicit --q4nx: gguf_to_onebp defaults to lossless F16 since #1728;
          # the gate's (10,40) window is calibrated for Q4NX 1BP output.
          ./build/gguf_to_onebp qwen3-0.6b-q8_0.gguf qwen3-0.6b-q4nx.1bp --q4nx
      - name: Run perplexity gate (assert 10 < ppl < 40)
        run: |
          ./build/ppl_generic qwen3-0.6b-q4nx.1bp \
            research/ws00-baseline/samples/ppl-gate-48.jsonl 4 | tee /tmp/ppl-out.txt
          PPL=$(grep -oE 'PPL = [0-9.]+' /tmp/ppl-out.txt | grep -oE '[0-9.]+')
          echo "PPL=$PPL"
          python3 - <<PY
          ppl = float("$PPL")
          assert 10.0 < ppl < 40.0, f"ppl {ppl} outside gate window (10, 40) — quant corruption or pipeline regression"
          print(f"✅ ppl {ppl} inside gate window")
          PY
