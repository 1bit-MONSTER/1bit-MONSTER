name: Census autopr

# Auto-file DRAFT PRs proposing a one-line bitnet_model.h alias for uncovered
# architecture classes that are plausible variants of a family the engine
# already knows (e.g. `kimik3` -> `kimi_k3`). census_autopr.py (called from
# hf_new_models.py) only guesses a candidate when the class is an edit-distance
# / known-family match; genuinely-new architectures and SIGNIFICANT arrivals
# (major family or vision/multimodal variant) are left as a manual alert — they
# need a real engine implementation, not an alias.
#
# Deliberately separate from census-watch.yml, which is ALERT-ONLY (read-only
# perms, no write token on schedule runs). This one runs the same watcher with
# the write/PR permissions needed to open draft PRs.
#
# Scheduled after census-watch (04:30 UTC) so the alert fires first.

on:
  schedule:
    - cron: "45 4 * * *"   # 04:45 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: census-autopr
  cancel-in-progress: false

jobs:
  autopr:
    name: File draft alias PRs for plausible new arch classes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Mint GitHub App installation token
        id: app-token
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          { [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; } || { echo "::error::APP_ID / APP_PRIVATE_KEY secrets not set — autopr cannot create PRs"; exit 1; }
          B64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          NOW=$(date +%s)
          HEADER=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | B64)
          PAYLOAD=$(printf '{"iat":%s,"exp":%s,"iss":%s}' "$((NOW-60))" "$((NOW+540))" "$APP_ID" | B64)
          SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -sign <(printf '%s' "$APP_PRIVATE_KEY") -binary | B64)
          JWT="$HEADER.$PAYLOAD.$SIG"
          AUTH="Authorization: Bearer $JWT"
          INSTALL_ID=$(curl -s -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations" | \
            jq -r --arg o "$GITHUB_REPOSITORY_OWNER" '.[] | select(.account.login == $o) | .id' | head -1)
          { [ -n "$INSTALL_ID" ]; } || { echo "::error::GitHub App not installed on $GITHUB_REPOSITORY_OWNER"; exit 1; }
          TOKEN=$(curl -s -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/$INSTALL_ID/access_tokens" | jq -r '.token // empty')
          { [ -n "$TOKEN" ]; } || { echo "::error::Could not mint installation token — check app permissions (Contents + Pull requests R/W)"; exit 1; }
          echo "TOKEN=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run the watcher with alias-autopr enabled
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.TOKEN }}
        run: |
          # CENSUS_SKIP_PR stays UNSET so census_autopr may file draft PRs.
          python3 Testing/hf_new_models.py --limit 120 2>&1 | tee /tmp/census-autopr.log
          echo "--- (draft PRs for plausible aliases; SIGNIFICANT/manual left as alerts) ---"

      - name: Generate blog posts for significant arrivals (announce + covered)
        id: sigpost
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A significant architecture arrival gets a blog entry: an ANNOUNCEMENT
          # (arrival detected, support in progress) the moment it is spotted, and
          # a COVERED post ("the engine now maps it") once support lands.
          # significant_model_post.py dedupes by (mode, model) so each stage
          # posts once. Uncovered arrivals get the announcement, not a false
          # "the engine runs it" claim.
          python3 - <<'PY'
          import json, subprocess, sys
          try:
              data = json.load(open("Testing/significant_arrivals.json"))
          except FileNotFoundError:
              print("no significant_arrivals.json yet"); sys.exit(0)
          made = 0
          for arch, e in sorted(data.items()):
              mode = "covered" if e.get("covered") else "announcement"
              r = subprocess.run(
                  ["python3", "Testing/significant_model_post.py", "--arch", arch,
                   "--model", e.get("model", "?"), "--family", e.get("family", ""),
                   "--mode", mode],
                  capture_output=True, text=True)
              out = (r.stdout or r.stderr).strip()
              print(out)
              if "already generated" not in out and r.stderr.strip() == "":
                  made += 1
          print(f"significant posts made: {made}")
          PY
          if git status --porcelain site/ Testing/significant_posts.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain site/ Testing/significant_posts.json
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open draft PR for significant posts
        if: steps.sigpost.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.TOKEN }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y%m%d)"
          BRANCH="post/significant-$DATE"
          if gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q .; then
            echo "PR for $BRANCH already open — nothing to do"; exit 0
          fi
          if git ls-remote --exit-code origin "$BRANCH" >/dev/null 2>&1; then git push origin --delete "$BRANCH"; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add site/ Testing/significant_posts.json Testing/significant_arrivals.json
          git commit -m "post: significant model-architecture arrival ($DATE)"
          git push origin "$BRANCH"
          {
            echo "New blog entry for a SIGNIFICANT model-architecture arrival that the engine now maps."
            echo "Generated by significant_model_post.py — the body is a scaffold for a human/PR-agent pass"
            echo "(details + decode-validation status); SEO tags are already present."
            echo; echo '```'; git status --porcelain site/ Testing/significant_posts.json; echo '```'
          } > /tmp/sig_pr_body.md
          gh pr create --base main --head "$BRANCH" --draft \
            --title "post: significant model arrival $DATE" \
            --body-file /tmp/sig_pr_body.md
