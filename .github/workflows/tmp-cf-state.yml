name: tmp-cf-state
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only Cloudflare state
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          API="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")
          echo "== token status =="
          curl -s "${auth[@]}" "$API/user/tokens/verify" | python3 -c "import sys,json;d=json.load(sys.stdin);print('success:',d.get('success'),'status:',d.get('status'))" || true
          echo "== pages projects (names) =="
          curl -s "${auth[@]}" "$API/accounts/$CF_ACCOUNT/pages/projects?per_page=50" | python3 -c "import sys,json;d=json.load(sys.stdin);print([p.get('name') for p in (d.get('result') or [])])" || true
          echo "== pages project 1bit-monster-docs =="
          curl -s "${auth[@]}" "$API/accounts/$CF_ACCOUNT/pages/projects/1bit-monster-docs" | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or {};print('found:',bool(r));print('name:',r.get('name'));print('domains:',r.get('domains'));print('subdomain:',r.get('subdomain'))" || true
          echo "== pages project 1bit-monster =="
          curl -s "${auth[@]}" "$API/accounts/$CF_ACCOUNT/pages/projects/1bit-monster" | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or {};print('found:',bool(r));print('name:',r.get('name'));print('domains:',r.get('domains'))" || true
          echo "== zone 1bit.monster (token scope) =="
          zone_id=$(curl -s "${auth[@]}" "$API/zones?name=1bit.monster&per_page=1" | python3 -c "import sys,json;d=json.load(sys.stdin);z=d.get('result',[]);print(z[0]['id'] if z else '')")
          echo "zone_id=$zone_id"
          if [ -n "$zone_id" ]; then
            echo "== docs.1bit.monster DNS records =="
            curl -s "${auth[@]}" "$API/zones/$zone_id/dns_records?name=docs.1bit.monster" | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result',[]);print([(x['id'],x['type'],x['name'],x['content'],x.get('proxied')) for x in r])" || true
            echo "== zone total DNS records =="
            curl -s "${auth[@]}" "$API/zones/$zone_id/dns_records?per_page=1" | python3 -c "import sys,json;d=json.load(sys.stdin);print('total:',d.get('result_info',{}).get('total_count'))" || true
          else
            echo "zone NOT visible -> token is account/pages-only, no Zone:DNS"
          fi
