name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  pr_agent:
    runs-on: [self-hosted, pr-agent]
    timeout-minutes: 20
    # Only run for same-repo PRs and trusted commenters (not external forks)
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # needed for gitnexus compare against origin/main
          clean: false    # self-hosted: keep .gitnexus across runs so analyze is incremental

      # GitNexus: build/refresh the local knowledge-graph index (incremental),
      # then map the PR diff to indexed symbols + affected execution flows.
      # The report is injected into the review via artifact_path below.
      # Only on pull_request events: comment-triggered runs have no
      # pull_request.base.sha for the cache key (PR agent still runs).
      # NOTE: self-hosted runner — the GitNexus index persists in the work
      # dir across runs, so analyze is incremental (no cold rebuild per PR).
      - name: GitNexus impact analysis
        if: github.event_name == 'pull_request'
        run: |
          set +e  # GitNexus is context-only; infra hiccups must not block the review
          npm install -g gitnexus@1.6.10-rc.204 2>/dev/null || true  # pre-installed on the self-hosted runner; no-op here
          # Register a restored cache index (no-op if absent), then refresh
          # incrementally. rc.204 pins the #2432 native-worker abort fix
          # (SIGABRT in Napi::Error on analyze) — 1.6.9 lacks it.
          gitnexus index . 2>/dev/null
          gitnexus analyze || gitnexus analyze
          gitnexus detect-changes --scope compare --base-ref "origin/${{ github.event.pull_request.base.ref }}" --repo 1bit-MONSTER \
            > gitnexus-context.md 2>&1
          echo "--- gitnexus report (first 30 lines) ---"
          head -30 gitnexus-context.md

      - name: PR Agent
        # Native runner: The-PR-Agent/pr-agent's Docker action is a thin
        # wrapper around pr_agent.servers.github_action_runner, so we invoke
        # the identical module directly (pip package pinned to the same
        # version as the action SHA it replaces, v0.42.0). This removes the
        # Docker dependency entirely — the job runs on any self-hosted runner.
        # The venv is created on first use and reused across runs; the pip
        # install is a fast no-op once the package is present.
        run: |
          if [ ! -x "$HOME/pr-agent-venv/bin/python" ]; then
            python3 -m venv "$HOME/pr-agent-venv"
          fi
          "$HOME/pr-agent-venv/bin/pip" install --quiet "pr-agent==0.42.0"
          "$HOME/pr-agent-venv/bin/python" -m pr_agent.servers.github_action_runner
        env:
          OPENAI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          OPENAI_API_BASE: https://api.moonshot.ai/v1
          # SECURITY: GITHUB_TOKEN with contents:write scope is used by
          # PR-Agent to post reviews/comments. Mitigation: the job-level `if`
          # guard above restricts execution to same-repo PRs only; external
          # forks are never processed. PR-Agent pinned to v0.42.0 (PyPI).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_FILE: .pr_agent.toml
          ARTIFACT_PATH: gitnexus-context.md
          ARTIFACT_INSTRUCTIONS: >
            This is a GitNexus knowledge-graph analysis of the PR's changed
            symbols: blast radius (upstream dependants), affected execution
            flows, and risk level. Use it to prioritize review effort on
            high-risk changes and to verify the PR's impact claims against
            the repo's actual call graph.
