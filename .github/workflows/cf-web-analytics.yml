name: CF Web Analytics Bootstrap

# One-shot (safe to re-run, idempotent): creates a Cloudflare Web Analytics
# site for 1bit.monster (if missing), injects the beacon script into every
# page in site/, and commits + pushes the result. Deploy workflow then ships
# it to GitHub Pages and Cloudflare Pages automatically.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Create Web Analytics site + inject beacon
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCT="$CLOUDFLARE_ACCOUNT_ID"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          api() { curl -s -H "$H" "$@"; }

          echo "== existing RUM sites =="
          SITES=$(api "https://api.cloudflare.com/client/v4/accounts/$ACCT/rum/site_info/list" || true)
          echo "$SITES" | jq -r '.result[]? | "\(.domain)  token=\(.site_token)"' || echo "$SITES" | head -c 500

          TOKEN=$(echo "$SITES" | jq -r '.result[]? | select(.domain == "1bit.monster") | .site_token // empty' 2>/dev/null || true)

          if [ -z "$TOKEN" ]; then
            echo "== creating RUM site for 1bit.monster =="
            CREATE=$(api -X POST -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCT/rum/site_info" \
              -d '{"host":"1bit.monster"}')
            echo "$CREATE" | jq .
            TOKEN=$(echo "$CREATE" | jq -r '.result.site_token // empty')
            SCRIPT=$(echo "$CREATE" | jq -r '.result.script // empty')
          fi

          if [ -z "$TOKEN" ]; then
            echo "::error::Could not obtain a Web Analytics site token. The CLOUDFLARE_API_TOKEN likely lacks the 'Web Analytics:Edit' permission — add it in the dashboard (My Profile > API Tokens) and re-run."
            exit 1
          fi
          echo "site_token=$TOKEN"

          if [ -z "${SCRIPT:-}" ]; then
            SCRIPT="<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{\"token\": \"$TOKEN\"}'></script>"
          fi
          echo "beacon=$SCRIPT"

          cd site
          COUNT=0
          for f in *.html; do
            if grep -q "cloudflareinsights.com/beacon.min.js" "$f"; then
              echo "already has beacon: $f"
            else
              python3 - "$f" "$SCRIPT" <<'PYEOF'
import sys
path, script = sys.argv[1], sys.argv[2]
html = open(path, encoding="utf-8").read()
if "</head>" in html:
    html = html.replace("</head>", script + "\n</head>", 1)
else:
    html = script + "\n" + html
open(path, "w", encoding="utf-8").write(html)
PYEOF
              echo "beacon injected: $f"
              COUNT=$((COUNT+1))
            fi
          done
          echo "injected into $COUNT file(s)"

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "no changes — nothing to commit"
            exit 0
          fi
          git add site/
          git commit -m "site: add Cloudflare Web Analytics beacon (1bit.monster)"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/1bit-MONSTER/1bit-MONSTER.git" HEAD:main
